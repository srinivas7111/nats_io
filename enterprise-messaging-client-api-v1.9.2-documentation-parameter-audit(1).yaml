  /api/v1/subscriptions/{subscriptionId}/events:
    get:
      tags:
      - Consumption
      operationId: streamConsumerEvents
      summary: Receive messages over SSE
      description: 'Opens an SSE connection for an ACTIVE PUSH subscription. The server emits message events with
        a stable opaque event ID/deliveryId, plus heartbeat events. Clients should reconnect using Last-Event-ID
        where supported. For JETSTREAM, reconnect does not replace explicit ACK/NAK settlement. CORE is transient:
        messages sent while disconnected may be lost and replay/acknowledgement are unavailable. For JETSTREAM message
        events, deliveryId is included and must be settled through the acknowledgement API. For CORE events, no
        deliveryId or settlement action is provided; CORE delivery is best-effort.'
      parameters:
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
        description: Runtime subscription handle returned by POST /api/v1/subscriptions.
      - *id002
      - *id003
      - *id004
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
        description: Optional SSE event identifier from the last event fully processed by the client; used to resume
          the event stream where supported.
      responses:
        '200':
          description: SSE event stream.
          content:
            text/event-stream:
              schema:
                type: string
              example: 'id: evt-10001

                event: message

                data: {"messageId":"payment-Pay-2026-000184-created","deliveryId":"dly-10001","destination":"payment.events","messagingMode":"JETSTREAM","payload":"eyJwYXltZW50SWQiOiJQYXktMTAwMSJ9","contentType":"application/json"}


                event: heartbeat

                data: {"timestamp":"2026-11-03T10:30:15Z"}

                '
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/CursorExpired'
