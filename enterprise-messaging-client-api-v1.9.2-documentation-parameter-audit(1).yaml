openapi: 3.0.3
info:
  title: Enterprise Messaging Platform - Comprehensive Client API
  version: 1.9.2
  description: '## Introduction


    Application-facing HTTP contract for the Enterprise Messaging SDK over NATS Core and JetStream.


    ## Contract principles


    - **Logical routing:** Applications use `destination`; native NATS subjects, stream names and cluster topology
    are internal.

    - **Client/Admin boundary:** Applications can discover authorized destinations and Admin-provisioned consumers.
    Provisioning destinations, streams, consumers, mappings and policies remains an Admin responsibility.

    - **CORE:** Transient, best-effort push delivery. No persistence, pull, durable replay or JetStream settlement.

    - **JETSTREAM:** Persistent messaging with managed pull/push delivery, settlement, replay and policy-controlled
    dead-letter handling.

    - **Delivery semantics:** At-least-once where redelivery applies. Consumers must be idempotent; exactly-once
    delivery is not promised.

    - **Payloads:** `payload` contains base64-encoded bytes; `contentType` identifies the original payload format.

    - **Batch publishing:** Synchronous batch returns per-message outcomes in the HTTP response. Asynchronous batch
    returns an operation ID for progress and paginated results.

    - **Batch input choices:** Batch endpoints accept a JSON `messages` array, an NDJSON request body, or multipart
    form data. In multipart form data, `file` is an optional field; provide either `file` or `messages`, not both.
    `preserveOrder` is optional.

    - **Large content:** Use asynchronous batch for large or long-running workloads. The SDK should stream file
    content rather than buffer the entire file. Internal storage or staging is not exposed by this contract.

    - **Operation tracking:** Use the Operations endpoints to inspect status, retrieve per-record outcomes and retry
    eligible failures.

    - **SDK responsibilities:** Attach authentication, correlation and tracing headers; preserve `clientRequestId`
    values across safe retries; and stream large request bodies.



    ## Batch request formats


    - `application/json`: submit a JSON object containing `messages` and optional `preserveOrder`.

    - `application/x-ndjson`: submit one `PublishRequest` JSON object per line.

    - `multipart/form-data`: submit either an optional `file` field (JSON or JSONL file) or a `messages` field;
    exactly one is required. The `file` field is optional because callers may use `messages` instead. Do not submit
    both fields.

    - The `file` field is a multipart form field in the request body, not a query parameter or a separate upload-session
    API.

    - Synchronous batch supports at most 1,000 records. Asynchronous batch is intended for larger workloads and
    is subject to configured platform limits.


    ## Multipart file field


    The `file` field is an optional multipart form field, not a query/path parameter. When using multipart/form-data,
    submit either `file` or `messages`; exactly one must be present. When using application/json or application/x-ndjson,
    do not send the multipart `file` field.'
  contact:
    name: Enterprise Messaging Platform Team
servers:
- url: https://messaging.example.com
  description: Environment-specific API host
security:
- BearerAuth: []
tags:
- name: Destinations
  description: Discover logical destinations authorized for the authenticated application.
- name: Consumers
  description: Read-only discovery of application-visible consumers provisioned by Platform/Admin.
- name: Publishing
  description: Single, synchronous batch, asynchronous batch and file-based bulk publishing.
- name: Request Reply
  description: Synchronous request/reply messaging.
- name: Consumption
  description: Pull messages or receive messages over Server-Sent Events using a runtime subscription handle.
- name: Delivery
  description: Settle JetStream deliveries with ACK, NAK, IN_PROGRESS or TERM; not applicable to CORE.
- name: Replay and Reprocessing
  description: Isolated replay sessions and controlled reprocessing of stored messages.
- name: Monitoring
  description: Consumer metrics, dead-letter inspection and asynchronous operation status.
- name: Health
  description: API liveness and readiness.
- name: Subscriptions
  description: Create, inspect, pause, resume and close application runtime handles for Admin-provisioned consumers.
x-sdk-runtime-guidance:
  authentication:
    scheme: Bearer JWT obtained through OAuth2/OIDC.
    tokenLifecycle: The Java SDK must accept a pluggable token provider that obtains, caches and refreshes access
      tokens. Attach the current token to every request and refresh/retry once only for an eligible authentication-expiry
      response.
    refreshOwnership: Token and client-secret lifecycle belongs to the identity provider integration. This API does
      not expose a token-refresh endpoint. Never embed client secrets or refresh tokens in application source code.
    applicationIdentity: The authenticated principal determines application ownership. If X-Application-Id is supplied,
      it must match the authenticated principal; it is not an authorization override.
  destinationModel: Destination is the only application-facing routing abstraction. The platform resolves destination
    to one or more NATS subjects and, for JETSTREAM, to an approved stream. Clients must not send subject or streamName.
  consumerModel: consumerId identifies a logical application consumer. consumerName is unique within an application
    and destination. Creating another consumerName creates an independent logical delivery position where supported.
    Repeating the same create request is idempotent and returns the existing consumer when its immutable attributes
    match; conflicting attributes return 409. The platform assigns and manages native consumer and durable names.
  modeRules:
    CORE: Best-effort transient messaging. No persistence, replay, durable cursor or JetStream acknowledgement.
      CORE consumers use PUSH delivery.
    JETSTREAM: Persistent messaging. Supports managed PULL or PUSH delivery, acknowledgements, replay and dead-letter
      handling subject to destination policy.
  serverSentEvents:
    reconnectHeader: Last-Event-ID
    behavior: Reconnect with the last completely processed event ID. Persist the cursor only after application processing
      succeeds. Use bounded exponential backoff with jitter and idempotent processing.
    cursorRecovery: If the cursor has expired or is unavailable, surface a recoverable cursor error and require
      an application-approved replay or reconciliation flow; never silently restart at the newest event.
  batchPublishing:
    syncMaximumItemsPerRequest: 1000
    correlation: Every input record must include a stable clientRequestId. Every result returns that ID and recordNumber;
      messageId is also returned when assigned.
    fileLimits: Maximum request size, file size, decoded payload size, record count and concurrency are enforced
      by platform policy. The API returns a validation error when a limit is exceeded.
    clientBehavior: For large files, stream the request body or multipart file rather than loading the entire file
      into memory. JSONL is recommended for record-by-record processing. Preserve stable per-record identifiers
      across retries.
    retries: Retry only retryable failed records with stable identifiers and an idempotency key. Never blindly resubmit
      the entire original file after an indeterminate result.
    asyncSubmission: POST /api/v1/messages/batch-async accepts JSON, NDJSON, or multipart JSON/JSONL file; returns
      an operationId for status and paginated results.
    syncSubmission: POST /api/v1/messages/batch accepts JSON, NDJSON, or multipart JSON/JSONL file; returns per-record
      outcomes synchronously.
    largeFileHandling: The SDK streams file content. Internal staging or object storage is not exposed as a client
      API.
  deliverySemantics: At-least-once delivery may produce duplicates. Consumers must be idempotent. CORE mode does
    not support ACK/NAK.
  replay:
    session: Replay creates an isolated replay session with its own cursor and delivery handles.
    liveConsumer: Replay must never rewind, pause or mutate the live durable consumer position.
    lifecycle: Create replay session, pull and settle replay deliveries, inspect session status, then close or allow
      expiry.
    limits: Replay is bounded by retention, destination policy, time range and platform quotas.
paths:
  /api/v1/destinations:
    get:
      tags:
      - Destinations
      operationId: listDestinations
      summary: List available destinations
      description: Returns logical destinations the authenticated application is authorized to use. Does not expose
        native subjects or stream names.
      parameters:
      - name: messagingMode
        in: query
        required: false
        schema:
          type: string
          enum:
          - CORE
          - JETSTREAM
        description: Filter results by messaging mode.
      - name: access
        in: query
        required: false
        schema:
          type: string
          enum:
          - PUBLISH
          - SUBSCRIBE
        description: Filter destinations by the authenticated application's access level, where supported.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        description: Maximum number of items to return in this page.
      - name: pageToken
        in: query
        required: false
        schema:
          type: string
        description: Opaque token returned by the previous page; omit it for the first page.
      responses:
        '200':
          description: Page of authorized destinations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationList'
              example:
                items:
                - &id001
                  destination: payment.events
                  supportedModes:
                  - JETSTREAM
                  access:
                  - PUBLISH
                  - SUBSCRIBE
                  status: ACTIVE
                  description: Payment lifecycle events
                  capabilities:
                  - PUBLISH
                  - BATCH_PUBLISH
                  - PULL
                  - PUSH
                  - ACKNOWLEDGEMENT
                  - REPLAY
                nextPageToken: next-page-token
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/destinations/{destination}:
    get:
      tags:
      - Destinations
      operationId: getDestination
      summary: Get destination details
      description: Returns the logical destination definition and supported capabilities. Native subject mappings
        and stream names are intentionally omitted.
      parameters:
      - name: destination
        in: path
        required: true
        schema:
          type: string
        description: Logical destination identifier. Native subject and stream names are not accepted.
      responses:
        '200':
          description: Destination details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destination'
              example: *id001
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/messages:
    post:
      tags:
      - Publishing
      operationId: publishMessage
      summary: Publish a message
      description: Publishes bytes to a logical destination. CORE is best-effort; JETSTREAM returns a persistence
        acknowledgement. The platform resolves all native routing and persistence resources.
      parameters:
      - &id002
        name: X-Application-Id
        in: header
        required: false
        schema:
          type: string
        description: Optional consistency header; must match the authenticated application principal.
      - &id003
        name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
        description: Optional application-generated correlation identifier propagated through the request for log
          and trace correlation.
      - &id004
        name: traceparent
        in: header
        required: false
        schema:
          type: string
          maxLength: 256
        description: Optional W3C Trace Context traceparent header used to propagate distributed tracing context.
      - &id005
        name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
        description: Stable client-generated key for deduplication within the configured window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
            example:
              destination: payment.events
              messagingMode: JETSTREAM
              payload: eyJldmVudElkIjoiZXZ0LTdmM2E5YzIxIiwiZXZlbnRUeXBlIjoiUEFZTUVOVF9DUkVBVEVEIiwicGF5bWVudElkIjoiUEFZLTIwMjYtMDAwMTg0In0=
              contentType: application/json
              headers:
                x-correlation-id: corr-20261103-000184
                x-source-system: payments-api
              messageId: payment-Pay-2026-000184-created
              clientRequestId: req-payment-20261103-000184
        description: Message to publish to the specified logical destination.
      responses:
        '202':
          description: Message accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
              example:
                clientRequestId: req-payment-20261103-000184
                messageId: payment-Pay-2026-000184-created
                destination: payment.events
                messagingMode: JETSTREAM
                status: ACCEPTED
                accepted: true
                persistenceAcknowledged: true
                publishedAt: '2026-11-03T08:45:15Z'
                correlationId: corr-20261103-000184
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/messages/batch:
    post:
      tags:
      - Publishing
      operationId: publishMessageBatch
      summary: Publish a synchronous batch
      description: 'Publishes 1 to 1,000 messages and returns per-message outcomes in the same HTTP response. Choose
        one request representation: an application/json body with a messages array, an application/x-ndjson body
        with one PublishRequest JSON object per line, or multipart/form-data. For multipart/form-data, the optional
        file field accepts a JSON or JSONL file; alternatively, provide the messages field. Do not provide both
        file and messages. The preserveOrder field is optional. The synchronous endpoint supports at most 1,000
        records and is subject to request-size and processing-time limits. Use the asynchronous endpoint for larger
        or long-running batches. Each record is processed independently; the batch is not atomic. Results are correlated
        by clientRequestId and input record number.'
      parameters:
      - *id002
      - *id003
      - *id004
      - *id005
      requestBody:
        required: true
        description: 'Select exactly one input form: JSON request body, NDJSON request body, or multipart form.
          Within multipart form data, file is an optional field: provide file or messages, but not both. The file
          field accepts a JSON or JSONL file. preserveOrder is optional.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchPublishRequest'
            example:
              messages:
              - destination: payment.events
                messagingMode: JETSTREAM
                payload: eyJhbW91bnQiOjEwMH0=
                contentType: application/json
                clientRequestId: req-payment-10001
              - destination: payment.events
                messagingMode: JETSTREAM
                payload: eyJhbW91bnQiOjIwMH0=
                contentType: application/json
                clientRequestId: req-payment-10002
              preserveOrder: true
          application/x-ndjson:
            schema:
              type: string
              format: binary
              description: 'NDJSON request body: one complete PublishRequest JSON object per line.'
            example: '{"destination":"payment.events","messagingMode":"JETSTREAM","payload":"eyJhbW91bnQiOjEwMH0=","contentType":"application/json","clientRequestId":"req-payment-10001"}\n{"destination":"payment.events","messagingMode":"JETSTREAM","payload":"eyJhbW91bnQiOjIwMH0=","contentType":"application/json","clientRequestId":"req-payment-10002"}'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BatchPublishMultipartRequest'
            encoding:
              messages:
                contentType: application/json
              file:
                contentType: application/json, application/x-ndjson
            examples:
              fileUpload:
                summary: Upload a JSONL file
                description: The file field is supplied; messages is omitted.
                value:
                  file: (binary JSONL file)
                  preserveOrder: true
              inlineMessages:
                summary: Supply messages as a multipart field
                description: The messages field is supplied; file is omitted.
                value:
                  messages:
                  - destination: payment.events
                    messagingMode: JETSTREAM
                    payload: eyJhbW91bnQiOjEwMH0=
                    contentType: application/json
                    clientRequestId: req-payment-10001
                  preserveOrder: true
      responses:
        '200':
          description: Per-message publish outcomes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchPublishResponse'
              example:
                total: 2
                accepted: 1
                failed: 1
                results:
                - index: 0
                  clientRequestId: req-payment-10001
                  messageId: payment-Pay-2026-000184-created
                  status: ACCEPTED
                  accepted: true
                  persistenceAcknowledged: true
                - index: 1
                  clientRequestId: req-payment-10002
                  messageId: payment-Pay-2026-000185-created
                  status: FAILED
                  accepted: false
                  error:
                    code: DESTINATION_UNAVAILABLE
                    message: Destination is temporarily unavailable.
                    retryable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/messages/batch-async:
    post:
      tags:
      - Publishing
      operationId: publishMessageBatchAsync
      summary: Submit an asynchronous batch
      description: 'Submits a large batch for asynchronous processing and returns an operation ID. Choose one request
        representation: an application/json body with a messages array, an application/x-ndjson body with one PublishRequest
        JSON object per line, or multipart/form-data. For multipart/form-data, the optional file field accepts a
        JSON or JSONL file; alternatively, provide the messages field. Do not provide both file and messages. The
        preserveOrder field is optional. Record-count, request-size, file-size and decoded-payload limits are enforced
        by platform policy. Each record is processed independently; the batch is not atomic. Results are correlated
        by clientRequestId and input record number.'
      parameters:
      - *id002
      - *id003
      - *id004
      - *id005
      requestBody:
        required: true
        description: 'Select exactly one input form: JSON request body, NDJSON request body, or multipart form.
          Within multipart form data, file is an optional field: provide file or messages, but not both. The file
          field accepts a JSON or JSONL file. preserveOrder is optional.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsyncBatchPublishRequest'
            example:
              messages:
              - destination: payment.events
                messagingMode: JETSTREAM
                payload: eyJhbW91bnQiOjEwMH0=
                contentType: application/json
                messageId: payment-10001-created
                clientRequestId: bulk-pay-000001
              - destination: payment.events
                messagingMode: JETSTREAM
                payload: eyJhbW91bnQiOjIwMH0=
                contentType: application/json
                messageId: payment-10002-created
                clientRequestId: bulk-pay-000002
              preserveOrder: true
          application/x-ndjson:
            schema:
              type: string
              format: binary
              description: 'NDJSON request body: one complete PublishRequest JSON object per line.'
            example: '{"destination":"payment.events","messagingMode":"JETSTREAM","payload":"eyJhbW91bnQiOjEwMH0=","contentType":"application/json","clientRequestId":"bulk-pay-000001"}\n{"destination":"payment.events","messagingMode":"JETSTREAM","payload":"eyJhbW91bnQiOjIwMH0=","contentType":"application/json","clientRequestId":"bulk-pay-000002"}'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AsyncBatchPublishMultipartRequest'
            encoding:
              messages:
                contentType: application/json
              file:
                contentType: application/json, application/x-ndjson
            examples:
              fileUpload:
                summary: Upload a JSONL file
                description: The file field is supplied; messages is omitted.
                value:
                  file: (binary JSONL file)
                  preserveOrder: true
              inlineMessages:
                summary: Supply messages as a multipart field
                description: The messages field is supplied; file is omitted.
                value:
                  messages:
                  - destination: payment.events
                    messagingMode: JETSTREAM
                    payload: eyJhbW91bnQiOjEwMH0=
                    contentType: application/json
                    clientRequestId: bulk-pay-000001
                  preserveOrder: true
      responses:
        '202':
          description: Batch accepted for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperationAccepted'
              example:
                operationId: op-bulk-payments-20261103-001
                status: ACCEPTED
                submittedAt: '2026-11-03T08:45:00Z'
                statusUrl: /api/v1/operations/op-bulk-payments-20261103-001
                resultsUrl: /api/v1/operations/op-bulk-payments-20261103-001/results
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/requests:
    post:
      tags:
      - Request Reply
      operationId: sendRequest
      summary: Send request and await reply
      description: Sends a request to an authorized logical destination and waits for a correlated reply up to timeoutMs.
        Request/reply is transient and best-effort; it does not provide durable request or reply storage. A timeout
        does not prove that the responder did not process the request. Applications must use a business correlation/idempotency
        strategy before retrying.
      parameters: &id006
      - *id002
      - *id003
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestReplyRequest'
            example:
              destination: payment.validation.requests
              messagingMode: CORE
              payload: eyJwYXltZW50SWQiOiJQYXktMTAwMSJ9
              contentType: application/json
              timeoutMs: 3000
        description: Request message and timeout configuration.
      responses:
        '200':
          description: Reply received.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestReplyResponse'
              example:
                destination: payment.validation.responses
                payload: eyJwYXltZW50SWQiOiJQQVktMTAwMSIsInZhbGlkIjoiVFJVRSJ9
                contentType: application/json
                headers:
                  responder: payment-validation-service
                correlationId: corr-pay-1001
                respondedAt: '2026-11-03T08:31:00Z'
        '504':
          description: No reply received before timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: REQUEST_TIMEOUT
                message: No responder replied before timeout.
                correlationId: corr-payment-1001
                retryable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/messages/reprocess:
    post:
      tags:
      - Replay and Reprocessing
      operationId: reprocessMessages
      summary: Reprocess selected messages
      description: Submits selected stored message IDs for controlled reprocessing. The platform validates source/target
        destination permissions and retention, records an asynchronous operation, and reports per-message outcomes.
        Reprocessing publishes a new delivery/message to the target destination; it does not rewind the original
        consumer cursor.
      parameters: *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReprocessRequest'
            example:
              sourceDestination: payment.events
              messageIds:
              - msg-01JBF8KQ7M4T2X9A
              - msg-01JBF8M2Z8Q6W4P1
              targetDestination: payment.events.reprocessed
              reason: Reprocess after correcting downstream validation.
        description: Source message selection, target destination and reason for reprocessing.
      responses:
        '202':
          description: Reprocessing operation accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperationAccepted'
              example:
                operationId: op-reprocess-payments-001
                status: ACCEPTED
                submittedAt: '2026-11-03T09:00:00Z'
                statusUrl: /api/v1/operations/op-reprocess-payments-001
                resultsUrl: /api/v1/operations/op-reprocess-payments-001/results
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '413':
