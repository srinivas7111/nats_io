  /api/v1/subscriptions/{subscriptionId}/pull:
    post:
      tags:
      - Consumption
      operationId: pullMessages
      summary: Pull messages
      description: Fetches a batch from an ACTIVE PULL-mode JETSTREAM subscription. Each item contains an opaque
        deliveryId for settlement. The server must enforce the consumer's configured maxAckPending, ackWait and
        policy limits. CORE and PUSH subscriptions do not support pull. An empty items array means no messages were
        available before expiry.
      parameters:
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
        description: Runtime subscription handle returned by POST /api/v1/subscriptions.
      - *id002
      - *id003
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PullRequest'
            example:
              batchSize: 20
              expiresInMs: 5000
        description: Pull batch size and maximum wait duration.
      responses:
        '200':
          description: Fetched messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullResponse'
              example:
                items:
                - messageId: msg-pay-20261103-000184
                  deliveryId: dly-pay-20261103-000184-01
                  destination: payment.events
                  messagingMode: JETSTREAM
                  payload: eyJvcmRlcklkIjoiT1JELTIwMjYtMTA0ODIiLCJwYXltZW50SWQiOiJQQVktOTg3NjU0MzIxIiwic3RhdHVzIjoiU1VDQ0VTUyJ9
                  contentType: application/json
                  headers:
                    source: payment-service
                    eventType: PAYMENT_SUCCESS
                  correlationId: corr-order-2026-10482
                  publishedAt: '2026-11-03T08:30:15Z'
                  delivery:
                    attempt: 1
                    deliveredAt: '2026-11-03T08:30:16Z'
                    acknowledgementDeadline: '2026-11-03T08:31:16Z'
                receivedCount: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
