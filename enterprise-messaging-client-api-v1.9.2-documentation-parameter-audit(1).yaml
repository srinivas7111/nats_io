      - Subscriptions
      summary: Pause or resume a subscription
      description: Pauses or resumes this runtime subscription handle only. It does not alter the Admin-managed
        consumer configuration. On pause, the server stops issuing new deliveries; already-issued JetStream deliveries
        remain subject to their acknowledgement deadlines and redelivery policy.
      operationId: updateSubscription
      parameters:
      - name: subscriptionId
        in: path
        required: true
