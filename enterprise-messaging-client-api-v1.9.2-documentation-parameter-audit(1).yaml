      tags:
      - Subscriptions
      summary: Close a subscription handle
      description: Closes this application runtime handle and releases its connection/resources. It does not delete
        or reset the Admin-managed consumer or durable delivery position.
      operationId: closeSubscription
      parameters:
      - name: subscriptionId
        in: path
        required: true
        description: Platform-issued application subscription handle.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '204':
          description: Subscription handle closed. Underlying managed consumer is not deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/subscriptions/{subscriptionId}/acknowledgements/batch:
    post:
      tags:
      - Delivery
      operationId: settleDeliveriesBatch
      summary: Settle multiple message deliveries
      description: Applies one settlement action to multiple delivery IDs issued to this subscription. JETSTREAM
        only. Each result is reported independently; partial success is possible.
      parameters:
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: Platform-issued runtime subscription handle returned by POST /api/v1/subscriptions.
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDeliveryActionRequest'
            example:
              action: ACK
              deliveryIds:
              - dly-01J9PAY001
              - dly-01J9PAY002
              - dly-01J9PAY003
        description: One settlement action and the delivery identifiers to which it applies.
      responses:
        '200':
          description: Per-delivery settlement results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDeliveryActionResponse'
              example:
                total: 2
                accepted: 2
                failed: 0
                results:
                - deliveryId: dly-10001
                  accepted: true
                  settledAt: '2026-11-03T09:15:00Z'
                - deliveryId: dly-10002
                  accepted: true
                  settledAt: '2026-11-03T09:15:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/subscriptions/{subscriptionId}/dead-letter-messages/{messageId}:
    get:
      tags:
      - Monitoring
      operationId: getDeadLetterMessage
      summary: Get a dead-letter message
      description: Returns the stored dead-letter record and failure metadata. Access is limited to messages associated
        with the application's authorized subscription. This is read-only; use the reprocess API to submit an authorized
        message for reprocessing.
      parameters:
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
        description: Platform-issued runtime subscription handle returned by POST /api/v1/subscriptions.
      - name: messageId
        in: path
        required: true
        schema:
          type: string
        description: Message identifier of the dead-letter record.
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Dead-letter message details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterMessage'
              example:
                messageId: msg-pay-failed-001
                destination: payment.events
                payload: eyJwYXltZW50SWQiOiJQQVktMTAwMSJ9
                failedAt: '2026-11-03T08:00:00Z'
                failureReason: MAX_DELIVERIES_EXCEEDED
                deliveryAttempts: 5
                reprocessable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/operations/{operationId}/results:
    get:
      tags:
      - Monitoring
      operationId: getOperationResults
      summary: Get paginated per-message outcomes
      description: Returns paginated per-record outcomes for an asynchronous batch or other supported bulk operation.
        Use nextPageToken until no further page is returned. Results are correlated using recordNumber and clientRequestId;
        do not assume a batch is atomic.
      parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: Platform-issued identifier returned when an asynchronous operation is accepted.
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACCEPTED
          - FAILED
          - SKIPPED
        description: Filter results by the resource or operation status values documented for this endpoint.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        description: Maximum number of items to return in this page.
      - name: pageToken
        in: query
        required: false
        schema:
          type: string
        description: Opaque token returned by the previous page; omit it for the first page.
      responses:
        '200':
          description: Page of per-message outcomes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResultPage'
              example:
                operationId: op-bulk-payments-20261103-001
                totalCount: 100000
                nextPageToken: eyJvZmZzZXQiOjEwMH0=
                items:
                - recordNumber: 1
                  clientRequestId: bulk-pay-000001
                  messageId: msg-pay-000001
                  status: ACCEPTED
                  persistenceAcknowledged: true
                - recordNumber: 2
                  clientRequestId: bulk-pay-000002
                  messageId: msg-pay-000002
                  status: FAILED
                  error:
                    code: PAYLOAD_INVALID
                    message: Payload is not valid base64.
                    retryable: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/operations/{operationId}/retry:
    post:
      tags:
      - Publishing
      operationId: retryOperationFailures
      summary: Retry failed operation entries
      description: Starts a retry operation for eligible failed records from the original asynchronous batch. Only
        retryable failures are retried by default. The retry is a new asynchronous operation and does not alter
        the original operation's recorded results.
      parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: string
        description: Platform-issued identifier returned when an asynchronous operation is accepted.
      - name: Idempotency-Key
        in: header
        required: true
        description: Stable key used to deduplicate retries of this retry request within the configured idempotency
          window.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryOperationRequest'
            example:
              resultFilter: RETRYABLE_FAILED
        description: Optional filter selecting eligible failed records. Supply idempotency through the Idempotency-Key
          header.
      responses:
        '202':
          description: Retry operation accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryOperationResponse'
              example:
                operationId: op-bulk-payments-20261103-001
                retryOperationId: op-retry-payments-20261103-001
                status: ACCEPTED
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/replay-sessions/{replaySessionId}:
    get:
      tags:
      - Replay and Reprocessing
      operationId: getReplaySession
      summary: Get replay session status
      parameters:
      - name: replaySessionId
        in: path
        required: true
        schema:
          type: string
        description: Platform-issued identifier returned when a replay session is created.
      responses:
        '200':
          description: Replay session details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaySession'
              example:
                replaySessionId: rpl-pay-001
                subscriptionId: sub-payment-001
                destination: payment.events
                status: ACTIVE
                createdAt: '2026-11-03T09:00:00Z'
                expiresAt: '2026-11-03T10:00:00Z'
                messagesAvailable: 250
                pullUrl: /api/v1/replay-sessions/rpl-pay-001/pull
                reason: Reconcile payment events
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/CursorExpired'
      description: Returns the status and replay boundaries for the isolated replay session. The session has its
        own cursor and does not change the live subscription's delivery position.
    delete:
      tags:
      - Replay and Reprocessing
      operationId: closeReplaySession
      summary: Close replay session
      description: Closes only the isolated replay session. Does not change the original subscription or its durable
        cursor.
      parameters:
      - name: replaySessionId
        in: path
        required: true
        schema:
          type: string
        description: Platform-issued identifier returned when a replay session is created.
      responses:
        '204':
          description: Replay session closed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/replay-sessions/{replaySessionId}/pull:
    post:
      tags:
      - Replay and Reprocessing
      operationId: pullReplayMessages
      summary: Pull messages from replay session
      description: Fetches replay messages from the isolated replay cursor. Settlement is scoped to replay delivery
        handles and never changes the live subscription cursor.
      parameters:
      - name: replaySessionId
        in: path
        required: true
        schema:
          type: string
        description: Platform-issued identifier returned when a replay session is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayPullRequest'
            example:
              batchSize: 100
              expiresInMs: 5000
              maxBytes: 10485760
        description: Replay pull batch size, wait duration and optional maximum response bytes.
      responses:
        '200':
          description: Replay messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayPullResponse'
              example:
                items:
                - messageId: msg-pay-historical-001
                  deliveryId: rpl-dly-pay-001
                  destination: payment.events
                  messagingMode: JETSTREAM
                  payload: eyJwYXltZW50SWQiOiJQQVktOTg3NjU0MzIxIiwic3RhdHVzIjoiU1VDQ0VTUyJ9
                  contentType: application/json
                  publishedAt: '2026-11-01T10:15:00Z'
                  delivery:
                    attempt: 1
                    deliveredAt: '2026-11-03T08:50:00Z'
                    acknowledgementDeadline: '2026-11-03T08:51:00Z'
                receivedCount: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/CursorExpired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/replay-sessions/{replaySessionId}/acknowledgements:
    post:
      tags:
      - Replay and Reprocessing
      operationId: settleReplayDelivery
      summary: Settle replay delivery
      description: Settles a delivery issued by this replay session. The deliveryId must belong to this replay session.
        CORE is not supported.
      parameters:
      - name: replaySessionId
        in: path
        required: true
        schema:
          type: string
        description: Platform-issued identifier returned when a replay session is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryActionRequest'
            example:
              deliveryId: rpl-dly-00001
              action: ACK
        description: Settlement action for a delivery issued by this replay session.
      responses:
        '200':
          description: Replay delivery settlement result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryActionResponse'
              example:
                deliveryId: dly-10001
                action: ACK
                accepted: true
                settledAt: '2026-11-03T09:15:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Optional application-generated correlation identifier propagated through the request for log
        and trace correlation.
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: Optional W3C Trace Context traceparent header used to propagate distributed tracing context.
      schema:
        type: string
        maxLength: 256
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: DESTINATION_NOT_FOUND
        message:
          type: string
          example: The requested destination is not available to this application.
        correlationId:
          type: string
        details:
          type: object
          additionalProperties: true
        retryable:
          type: boolean
          description: Whether retrying the same logical request may succeed without changing its contents.
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        retryAfterMs:
          type: integer
          minimum: 0
      description: Standard error response returned when an API request cannot be completed.
    MessagingMode:
      type: string
      enum:
      - CORE
      - JETSTREAM
      description: 'Messaging delivery mode selected for the operation: CORE or JETSTREAM.'
    Destination:
      type: object
      required:
      - destination
      - supportedModes
      - access
      - status
      properties:
        destination:
          type: string
          example: payment.events
        description:
          type: string
        supportedModes:
          type: array
          items:
            $ref: '#/components/schemas/MessagingMode'
        access:
          type: array
          items:
            type: string
            enum:
            - PUBLISH
            - SUBSCRIBE
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
        capabilities:
          type: array
          items:
            type: string
            enum:
            - PUBLISH
            - BATCH_PUBLISH
            - REQUEST_REPLY
            - PULL
            - PUSH
            - ACKNOWLEDGEMENT
            - REPLAY
            - DEAD_LETTER
      description: Application-visible logical destination and its supported capabilities; native routing identifiers
        are omitted.
    DestinationList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Destination'
        nextPageToken:
          type: string
      description: Paginated list of logical destinations available to the authenticated application.
    Consumer:
      type: object
      required:
      - consumerId
      - consumerName
      - destination
      - messagingMode
      - deliveryMode
      - status
      - createdAt
      properties:
        consumerId:
          type: string
          example: con-payment-001
        consumerName:
          type: string
          example: payment-processor
        destination:
          type: string
          example: payment.events
        messagingMode:
          $ref: '#/components/schemas/MessagingMode'
        deliveryMode:
          type: string
          enum:
          - PULL
          - PUSH
        status:
          type: string
          enum:
          - ACTIVE
          - PAUSED
          - FAILED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        capabilities:
          type: array
          items:
            type: string
        configuration:
          type: object
          description: Effective application-visible settings; platform-controlled native settings may be omitted.
          properties:
            startPosition:
              type: string
            filter:
              type: object
              additionalProperties:
                type: string
      description: Application-visible reference to an Admin-provisioned consumer. Native stream and durable names
        are omitted.
    ConsumerList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Consumer'
        nextPageToken:
          type: string
      description: Paginated list of Admin-provisioned consumers available to the authenticated application.
    PublishRequest:
      type: object
      required:
      - clientRequestId
      - destination
      - messagingMode
      - payload
      properties:
        destination:
          type: string
          example: payment.events
        messagingMode:
          $ref: '#/components/schemas/MessagingMode'
        payload:
          type: string
          format: byte
          maxLength: 13981016
          description: Base64-encoded bytes. Maximum decoded size is 10 MiB unless destination policy specifies
            a lower limit.
        contentType:
          type: string
          maxLength: 128
          default: application/json
        headers:
          type: object
          maxProperties: 32
          additionalProperties:
            type: string
            maxLength: 1024
        messageId:
          type: string
          maxLength: 128
          description: Optional caller-assigned business message ID. Must be unique within the destination/idempotency
            scope.
        key:
          type: string
          description: Optional business key used for grouping or ordering where supported.
        timeoutMs:
          type: integer
          minimum: 1
          maximum: 60000
          default: 5000
        clientRequestId:
          type: string
          minLength: 1
          maxLength: 128
          description: Stable caller-generated identifier used to correlate this input with its outcome.
      description: One message to publish to a logical destination. payload contains base64-encoded bytes.
    PublishResponse:
      type: object
      required:
      - clientRequestId
      - messageId
      - destination
      - messagingMode
      - status
      - accepted
      properties:
        messageId:
          type: string
        destination:
          type: string
        messagingMode:
          $ref: '#/components/schemas/MessagingMode'
        accepted:
          type: boolean
        publishedAt:
          type: string
          format: date-time
        persistenceAcknowledged:
          type: boolean
        correlationId:
          type: string
        clientRequestId:
          type: string
        status:
          type: string
          enum:
          - ACCEPTED
          - FAILED
        sequence:
          type: integer
          minimum: 1
          description: Optional platform-safe publish sequence; only present when policy permits exposing it.
      description: Acknowledgement and assigned identifiers for a published message.
    BatchPublishRequest:
      type: object
      required:
      - messages
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/PublishRequest'
        preserveOrder:
          type: boolean
          default: true
      description: JSON request representation for synchronous batch publishing (maximum 1,000 messages).
    BatchPublishResponse:
      type: object
      required:
      - total
      - accepted
      - failed
      - results
      properties:
        total:
          type: integer
          minimum: 0
        accepted:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchPublishItemResult'
      description: Per-message outcomes for a synchronous batch. A batch can contain both accepted and failed messages.
    AsyncBatchPublishRequest:
      type: object
      required:
      - messages
      properties:
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PublishRequest'
          description: Messages are processed independently. Each item must include a unique clientRequestId within
            this submitted batch.
        preserveOrder:
          type: boolean
          default: true
      description: JSON request representation for asynchronous batch publishing. The maximum record count and request
        size are controlled by platform policy.
    AsyncOperationAccepted:
      type: object
      required:
      - operationId
      - status
      properties:
        operationId:
          type: string
        status:
          type: string
          enum:
          - ACCEPTED
          - RUNNING
        submittedAt:
          type: string
          format: date-time
        statusUrl:
          type: string
          format: uri-reference
        resultsUrl:
          type: string
          format: uri-reference
      description: Identifier and links for an accepted asynchronous operation.
    RequestReplyRequest:
      type: object
      required:
      - destination
      - messagingMode
      - payload
      properties:
        destination:
          type: string
        messagingMode:
          $ref: '#/components/schemas/MessagingMode'
        payload:
          type: string
          format: byte
        contentType:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        timeoutMs:
          type: integer
          minimum: 1
          maximum: 60000
          default: 5000
      description: Transient request/reply message and timeout configuration.
    RequestReplyResponse:
      type: object
      required:
      - destination
      - payload
      properties:
        destination:
          type: string
        payload:
          type: string
          format: byte
        contentType:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        correlationId:
          type: string
        respondedAt:
          type: string
          format: date-time
      description: Correlated reply returned by the responder before the configured timeout.
    PullRequest:
      type: object
      properties:
        batchSize:
          type: integer
          minimum: 1
          maximum: 1000
          default: 10
        expiresInMs:
          type: integer
          minimum: 1
          maximum: 60000
          default: 5000
        maxBytes:
          type: integer
          minimum: 1
          maximum: 104857600
      description: Pull size and wait duration for an active PULL-mode JetStream subscription.
    DeliveredMessage:
      type: object
      required:
      - messageId
      - deliveryId
      - destination
      - messagingMode
      - payload
      properties:
        messageId:
          type: string
        deliveryId:
          type: string
          description: Opaque delivery handle; required for JetStream acknowledgement.
        destination:
          type: string
        messagingMode:
          $ref: '#/components/schemas/MessagingMode'
        payload:
          type: string
          format: byte
        contentType:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        correlationId:
          type: string
        publishedAt:
          type: string
          format: date-time
        delivery:
          type: object
          properties:
            attempt:
              type: integer
            deliveredAt:
              type: string
              format: date-time
            acknowledgementDeadline:
              type: string
              format: date-time
      description: Message envelope delivered to an application subscription, including an opaque delivery handle
        when settlement applies.
    PullResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeliveredMessage'
        receivedCount:
          type: integer
        nextToken:
          type: string
      description: Messages returned by a pull request. An empty items array means no message was available before
        expiry.
    DeliveryActionRequest:
      type: object
      required:
      - deliveryId
      - action
      properties:
        deliveryId:
          type: string
        action:
          type: string
          enum:
          - ACK
          - NAK
          - IN_PROGRESS
          - TERM
        delayMs:
          type: integer
          minimum: 0
          maximum: 86400000
          description: Optional delay before redelivery; relevant to NAK.
        extendMs:
          type: integer
          minimum: 1
          maximum: 300000
          description: Requested processing extension; relevant to IN_PROGRESS.
        reason:
          type: string
          maxLength: 512
        metadata:
          type: object
          additionalProperties:
            type: string
      description: Settlement action for one JetStream delivery.
    DeliveryActionResponse:
      type: object
      required:
      - deliveryId
      - action
      - accepted
      properties:
        deliveryId:
          type: string
        action:
          type: string
          enum:
          - ACK
          - NAK
          - IN_PROGRESS
          - TERM
        accepted:
          type: boolean
        settledAt:
          type: string
          format: date-time
      description: Outcome of settling one JetStream delivery.
    ReplayRequest:
      type: object
      required:
      - startPosition
      - reason
      properties:
        startPosition:
          type: string
          enum:
          - EARLIEST
          - TIMESTAMP
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 1
          maxLength: 512
        maxMessages:
          type: integer
          minimum: 1
          maximum: 1000000
      description: Replay boundaries used to create an isolated replay session.
    ReprocessRequest:
      type: object
      required:
      - sourceDestination
      - messageIds
      properties:
        sourceDestination:
          type: string
        messageIds:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
        targetDestination:
          type: string
        reason:
          type: string
          maxLength: 512
      description: Selection and target for publishing previously stored messages again as new messages.
    ConsumerMetrics:
      type: object
      required:
      - consumerId
      - status
      properties:
        consumerId:
          type: string
        status:
          type: string
        pendingMessages:
          type: integer
        ackPending:
          type: integer
        redeliveredMessages:
          type: integer
        deliveredMessages:
          type: integer
        lastDeliveryAt:
          type: string
          format: date-time
        observedAt:
          type: string
          format: date-time
      description: Application-visible metrics for the managed consumer associated with a subscription.
    DeadLetterMessageList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeadLetterMessage'
        nextPageToken:
          type: string
      description: Paginated dead-letter records visible to the application.
    Operation:
      type: object
      required:
      - operationId
      - status
      properties:
        operationId:
          type: string
        status:
          type: string
          enum:
          - ACCEPTED
          - RUNNING
          - SUCCEEDED
          - PARTIAL_SUCCESS
          - FAILED
        submittedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        result:
          type: object
          additionalProperties: true
        error:
          $ref: '#/components/schemas/Error'
        totalCount:
          type: integer
          minimum: 0
        processedCount:
          type: integer
          minimum: 0
        acceptedCount:
          type: integer
          minimum: 0
        failedCount:
          type: integer
          minimum: 0
        skippedCount:
          type: integer
          minimum: 0
        progressPercentage:
          type: number
          minimum: 0
          maximum: 100
        startedAt:
          type: string
          format: date-time
        resultCount:
          type: integer
          minimum: 0
        resultsUrl:
          type: string
          format: uri-reference
        failureReportUrl:
          type: string
          format: uri-reference
      description: State and progress counters for an asynchronous operation.
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - UP
      description: Process liveness status.
    Readiness:
      type: object
      required:
      - status
      - dependencies
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum:
            - UP
            - DOWN
            - DEGRADED
      description: Readiness status and dependency checks for serving application requests.
    CreateSubscriptionRequest:
      type: object
      required:
      - consumerId
      properties:
        consumerId:
          type: string
          minLength: 1
          maxLength: 128
          description: ID of a consumer provisioned by the Admin API and made available to this application.
          example: con-payment-001
        clientInstanceId:
          type: string
          maxLength: 128
          description: Optional stable identifier for this application runtime instance.
          example: payment-worker-instance-07
      additionalProperties: false
      description: Request to open a runtime subscription handle against an existing Admin-provisioned consumer.
    Subscription:
      type: object
      required:
      - subscriptionId
      - consumerId
      - destination
      - messagingMode
      - deliveryMode
      - status
      - createdAt
      properties:
        subscriptionId:
          type: string
          example: sub-payment-001
        consumerId:
          type: string
          example: con-payment-001
        destination:
          type: string
          example: payment.events
        messagingMode:
          $ref: '#/components/schemas/MessagingMode'
        deliveryMode:
          type: string
          enum:
          - PULL
          - PUSH
        status:
          type: string
          enum:
          - ACTIVE
          - PAUSED
          - CLOSED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        eventsUrl:
          type: string
          format: uri-reference
          description: Present for PUSH subscriptions.
      description: Application runtime subscription handle and its visible delivery configuration.
    SubscriptionList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
        nextPageToken:
          type: string
      description: Paginated list of runtime subscription handles owned by the authenticated application.
    UpdateSubscriptionRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - PAUSED
      additionalProperties: false
      description: Request to pause or resume a runtime subscription handle.
    BatchDeliveryActionRequest:
      type: object
      required:
      - action
      - deliveryIds
      properties:
        action:
          type: string
          enum:
          - ACK
          - NAK
          - IN_PROGRESS
          - TERM
        deliveryIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items:
            type: string
            minLength: 1
        delayMs:
          type: integer
          minimum: 0
          maximum: 86400000
          description: Optional redelivery delay for NAK.
        extendMs:
          type: integer
          minimum: 1
          maximum: 300000
          description: Requested processing extension for IN_PROGRESS.
        reason:
          type: string
          maxLength: 512
      additionalProperties: false
      description: One settlement action applied independently to multiple JetStream delivery handles.
    BatchDeliveryActionResponse:
      type: object
      required:
      - total
      - accepted
      - failed
      - results
      properties:
        total:
          type: integer
          minimum: 0
        accepted:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        results:
          type: array
          items:
            type: object
            required:
            - deliveryId
            - accepted
            properties:
              deliveryId:
                type: string
              accepted:
                type: boolean
              settledAt:
                type: string
                format: date-time
              error:
                $ref: '#/components/schemas/Error'
      description: Per-delivery outcomes for a batch settlement request.
    DeadLetterMessage:
      type: object
      required:
      - messageId
      - destination
      - payload
      - failedAt
      - failureReason
      properties:
        messageId:
          type: string
        destination:
          type: string
        payload:
          type: string
          format: byte
          description: Base64-encoded original payload.
        contentType:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        correlationId:
          type: string
        publishedAt:
          type: string
          format: date-time
        failedAt:
          type: string
          format: date-time
        deliveryAttempts:
          type: integer
          minimum: 1
        failureReason:
          type: string
        lastError:
          type: string
        sourceConsumerId:
          type: string
        reprocessable:
          type: boolean
        originalMessageId:
          type: string
        reasonCode:
          type: string
      description: Stored dead-letter record with failure and original-message metadata.
    FieldError:
      type: object
      required:
      - field
      - code
      - message
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
      description: Validation error associated with a specific request field.
    ReplaySession:
      type: object
      required:
      - replaySessionId
      - subscriptionId
      - destination
      - status
      - createdAt
      properties:
        replaySessionId:
          type: string
        subscriptionId:
          type: string
        destination:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - COMPLETED
          - CANCELLED
          - EXPIRED
          - FAILED
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        messagesAvailable:
          type: integer
          minimum: 0
        pullUrl:
          type: string
          format: uri-reference
        reason:
          type: string
      description: Isolated replay session with its own cursor and lifecycle state.
    ReplayPullRequest:
      type: object
      properties:
        batchSize:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        expiresInMs:
          type: integer
          minimum: 1
          maximum: 60000
          default: 5000
        maxBytes:
          type: integer
          minimum: 1
          maximum: 104857600
      description: Batch size, wait duration and optional byte limit for pulling from a replay session.
    ReplayPullResponse:
      type: object
      required:
      - items
      - receivedCount
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeliveredMessage'
        receivedCount:
          type: integer
          minimum: 0
        nextToken:
          type: string
      description: Messages delivered from an isolated replay session.
    OperationResultPage:
      type: object
      required:
      - operationId
      - items
      - totalCount
      properties:
        operationId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OperationItemResult'
        totalCount:
          type: integer
          minimum: 0
        nextPageToken:
          type: string
      description: Paginated per-record outcomes for an asynchronous operation.
    OperationItemResult:
      type: object
      required:
      - recordNumber
      - clientRequestId
      - status
      properties:
        recordNumber:
          type: integer
          minimum: 1
        clientRequestId:
          type: string
        messageId:
          type: string
        status:
          type: string
          enum:
          - ACCEPTED
          - FAILED
          - SKIPPED
        persistenceAcknowledged:
          type: boolean
        error:
          $ref: '#/components/schemas/Error'
      description: Outcome for one input record in an asynchronous operation.
    RetryOperationRequest:
      type: object
      properties:
        resultFilter:
          type: string
          enum:
          - FAILED
          - RETRYABLE_FAILED
          default: RETRYABLE_FAILED
      description: Optional filters for selecting eligible failed records. Supply idempotency through the Idempotency-Key
        request header.
    RetryOperationResponse:
      type: object
      required:
      - operationId
      - retryOperationId
      - status
      properties:
        operationId:
          type: string
        retryOperationId:
          type: string
        status:
          type: string
          enum:
          - ACCEPTED
          - RUNNING
      description: Identifier and status of the newly accepted retry operation.
    BatchPublishItemResult:
      type: object
      required:
      - index
      - clientRequestId
      - status
      - accepted
      properties:
        index:
          type: integer
          minimum: 0
          description: Zero-based index of the input message in the submitted batch.
        clientRequestId:
          type: string
          minLength: 1
          maxLength: 128
          description: Echoes the corresponding input message clientRequestId.
        messageId:
          type: string
          description: Echoes the caller-assigned messageId or returns the platform-assigned message identifier.
        status:
          type: string
          enum:
          - ACCEPTED
          - FAILED
        accepted:
          type: boolean
        persistenceAcknowledged:
          type: boolean
          description: Present for JETSTREAM when the platform has received the JetStream publish acknowledgement.
        error:
          $ref: '#/components/schemas/Error'
      description: Outcome for one input message. Results are returned in input order and correlated by index and
        clientRequestId.
    BatchPublishMultipartRequest:
      type: object
      description: Multipart form. Supply exactly one of messages or file. The file field is optional when messages
        is supplied.
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/PublishRequest'
          description: Optional JSON array of messages. Use this field instead of file when not uploading a file.
        file:
          type: string
          format: binary
          description: Optional JSON or JSONL file containing up to 1,000 messages. Use this field instead of messages.
        preserveOrder:
          type: boolean
          default: true
          description: Whether the service should preserve input order.
      oneOf:
      - required:
        - messages
      - required:
        - file
      additionalProperties: false
    AsyncBatchPublishMultipartRequest:
      type: object
      description: Multipart form. Supply exactly one of messages or file. The file field is optional when messages
        is supplied.
      properties:
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PublishRequest'
          description: Optional JSON array of messages. Use this field instead of file when not uploading a file.
        file:
          type: string
          format: binary
          description: Optional JSON or JSONL file containing the messages to process asynchronously. Use this field
            instead of messages.
        preserveOrder:
          type: boolean
          default: true
          description: Whether the service should preserve input order.
      oneOf:
      - required:
        - messages
      - required:
        - file
      additionalProperties: false
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: BADREQUEST
            message: Invalid request.
    Unauthorized:
      description: Authentication is required or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Authentication is required or invalid.
    Forbidden:
      description: The application is not authorized for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: The application is not authorized for this operation.
    NotFound:
      description: The requested resource was not found or is not visible to this application.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOTFOUND
            message: The requested resource was not found or is not visible to this application.
    Conflict:
      description: The request conflicts with the current resource state or an idempotency constraint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: CONFLICT
            message: The request conflicts with the current resource state or an idempotency constraint.
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: TOOMANYREQUESTS
            message: Rate limit exceeded.
    ServerError:
      description: Unexpected platform error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: SERVERERROR
            message: Unexpected platform error.
    CursorExpired:
      description: The supplied event cursor is no longer available. Use an approved replay or reconciliation flow.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: CURSOREXPIRED
            message: The supplied event cursor is no longer available. Use an approved replay or reconciliation
              flow.
    PayloadTooLarge:
      description: Request or uploaded file exceeds the configured size limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: PAYLOAD_TOO_LARGE
            message: The request exceeds the configured size limit.
            retryable: false
    UnsupportedMediaType:
      description: The request media type or file format is not supported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNSUPPORTED_MEDIA_TYPE
            message: The supplied media type or file format is not supported.
            retryable: false
    UnprocessableEntity:
      description: The request is syntactically valid but fails semantic validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_FAILED
            message: One or more fields or records failed validation.
            retryable: false
    ServiceUnavailable:
      description: The service or a required dependency is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: SERVICE_UNAVAILABLE
            message: The service is temporarily unavailable.
            retryable: true
x-client-api-guidance:
  modeCapabilities:
    CORE:
      publish: true
      batchPublish: true
      requestReply: true
      pushSubscription: true
      pull: false
      acknowledgement: false
      replay: false
      deadLetter: false
      durableCursor: false
    JETSTREAM:
      publish: true
      batchPublish: true
      requestReply: Only if explicitly enabled as transient request/reply
      pushSubscription: true
      pull: true
      acknowledgement: true
      replay: true
      deadLetter: Policy-dependent
      durableCursor: true
  runtimeRules:
  - Client APIs use logical destinations only; internal routing identifiers are not accepted.
  - Consumer create/update/delete and destination/stream provisioning are Admin API responsibilities.
  - A subscription is a runtime handle, not a consumer. Closing it must not delete or reset the managed consumer.
  - Replay must use an isolated replay cursor and must not rewind the live durable consumer.
  - A timeout or lost HTTP response after publish can leave the outcome unknown; use Idempotency-Key and query operation/status
    where available.
  - Delivery is at-least-once where JetStream redelivery applies; client processing must be idempotent.
  - SSE reconnection is transport recovery, not a substitute for JetStream ACK settlement.
  - CORE is transient and may lose messages during disconnects; no ACK, pull, replay or DLQ semantics.
  errorHandling:
    '400': Malformed request, invalid field combination or unsupported mode/capability.
    '401': Missing/expired/invalid bearer token.
    '403': Application is authenticated but not authorized for the destination, consumer or operation.
    '404': Destination, consumer, subscription, operation or message is not visible/found.
    '409': State conflict, stale delivery handle, duplicate idempotency key with different request, or invalid lifecycle
      transition.
    '410': Subscription or SSE cursor expired/evicted and cannot be resumed.
    '429': Rate/concurrency/quota limit exceeded; honor Retry-After.
    '500': Unexpected platform failure; retry only with idempotency safeguards.
    '502': Upstream messaging dependency failure; outcome may be indeterminate for publish operations.
    '503': Platform temporarily unavailable or not ready; honor Retry-After.
    '504': Request/reply or bounded operation timed out.
    '413': Request or upload exceeds configured size limit.
    '415': Unsupported request content type or bulk file format.
    '422': Syntactically valid request or file contains semantic validation errors.
  validationRules:
  - clientRequestId is mandatory for batch and bulk records and must be unique within a submitted batch/file.
  - messageId is stable across retries; duplicate message IDs with identical content follow the configured deduplication
    policy; conflicting content returns 409.
  - Payload must be valid base64 and must not exceed the effective destination payload limit after decoding.
  - contentType must be a valid media type; headers must not override reserved transport/security headers.
  - CORE cannot use pull, ACK/NAK/IN_PROGRESS/TERM, durable replay or JetStream DLQ operations.
  - JETSTREAM pull requires an ACTIVE PULL subscription; SSE requires an ACTIVE PUSH subscription.
  - Replay time ranges require startAt when startPosition is TIMESTAMP; endAt must be later than startAt and cannot
    exceed retention.
  - NAK accepts delayMs only; IN_PROGRESS accepts extendMs only; ACK and TERM do not accept delayMs or extendMs.
  - Every batch/async/bulk operation produces exactly one terminal result per input record, including validation
    failures and skipped records.
  - Pagination tokens are opaque, scoped to the authenticated application and query filters, and expire according
    to platform policy.
  batchPublishing:
    asyncSubmission: POST /api/v1/messages/batch-async accepts JSON, NDJSON, or multipart JSON/JSONL file; returns
      an operationId for status and paginated results.
    fileLimits: Maximum request size, file size, decoded payload size, record count and concurrency are enforced
      by platform policy. The API returns a validation error when a limit is exceeded.
    clientBehavior: For large files, stream the request body or multipart file rather than loading the entire file
      into memory. Use JSONL for efficient record-by-record processing. Preserve stable per-record identifiers across
      retries.
    syncMaximumItemsPerRequest: 1000
    syncSubmission: POST /api/v1/messages/batch accepts JSON, NDJSON, or multipart JSON/JSONL file; returns per-record
      outcomes synchronously.
    largeFileHandling: The SDK streams file content. Internal staging or object storage is not exposed as a client
      API.
