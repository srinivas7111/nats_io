x-client-identity:
  applicationHeader: X-Application-Id
  identityRule: The header value must match an application identity authorized by the bearer token. The header is
    a routing identifier, not an authentication mechanism.
x-stream-naming-convention:
  pattern: '{NORMALIZED_APPLICATION_ID}_STREAM'
  normalization: Uppercase the registered application ID; replace non-alphanumeric runs with a single underscore;
    trim leading/trailing underscores; append _STREAM.
  example:
    applicationId: payments_factory
    streamName: PAYMENTS_FACTORY_STREAM
  ownership: The platform provisions and owns streams. Clients may reference only streams assigned to their authenticated
    application; they cannot create, update or delete streams.
x-messaging-mode-rules:
  CORE: No streamName. Transient messaging; no JetStream persistence, durable consumer, replay or JetStream acknowledgement
    guarantees.
  JETSTREAM: streamName is required for operations that address persisted messaging. The platform validates stream
    ownership and maps logical destinations to configured subjects.
  apiVersion: Version the HTTP contract in the URL path, e.g. /api/v1/messages. Do not send apiVersion as a repeated
    request field.
x-destination-governance:
  clientModel: Clients request logical destination registration; they do not create native NATS subjects.
  core: Platform validates the destination name and grants publish/subscribe permissions according to application
    policy.
  jetstream: Platform validates that the destination is mapped to an existing approved stream. Any stream configuration
    change or new stream provisioning is an SRE/platform-admin operation.
  security: Application identity from X-Application-Id must match the authenticated principal. A client cannot register
    destinations for another application.
  recommendation: Prefer pre-approved destinations for production. Allow self-service registration only through
    platform policy, quotas, naming rules and audit logging.
x-naming-conventions:
  httpApi:
    style: REST resource-oriented
    rules:
    - Use plural resource nouns, for example /messages, /subscriptions and /destinations.
    - Use lowercase path segments; use kebab-case only for multiword resource names.
    - Use HTTP methods to express standard CRUD actions; avoid Java-style paths such as /api/getMessage or /api/getMeggage.
    - Every operation path must explicitly start with /api/v1/, for example /api/v1/messages. Keep the servers URL
      at the host root to prevent duplicate version prefixes.
  javaSdk:
    style: Java lowerCamelCase
    examples:
      publishMessage: messagingClient.publishMessage(message)
      receiveMessages: messagingClient.receiveMessages(subscriptionId, options)
      getSubscription: messagingClient.getSubscription(subscriptionId)
      requestReply: messagingClient.requestReply(request, PaymentStatus.class)
    types: Java classes and interfaces use UpperCamelCase; constants use UPPER_SNAKE_CASE.
x-java-sdk-method-mapping:
- httpMethod: POST
  path: /api/v1/messages
  javaMethod: publishMessage
- httpMethod: POST
  path: /api/v1/messages/batch
  javaMethod: publishMessages
- httpMethod: POST
  path: /api/v1/subscriptions
  javaMethod: createSubscription
- httpMethod: GET
  path: /api/v1/subscriptions/{subscriptionId}/messages
  javaMethod: receiveMessages
- httpMethod: POST
  path: /api/v1/requests
  javaMethod: requestReply
- httpMethod: POST
  path: /api/v1/destinations
  javaMethod: registerDestination
x-client-api-coverage:
  included:
  - Core NATS publish and subscribe semantics
  - JetStream publish acknowledgement and deduplication via Idempotency-Key
  - Batch publish
  - Pull consumption and SSE push delivery
  - Explicit ACK, NAK with optional delay, in-progress extension and terminal failure
  - Subscription create/list/get/close/pause/resume
  - Subscription delivery and acknowledgement metrics
  - Request-reply with timeout
  - Replay from supported logical start positions
  - Selected-message reprocessing
  - Dead-letter inspection when DLQ policy is enabled
  - Logical destination registration, discovery and authorization
  - Asynchronous operation tracking and health endpoints
  intentionally_not_client_exposed:
  - Create/update/delete/list native streams and native consumers
  - Stream retention, storage, replication, discard, max message and placement configuration
  - Consumer configuration such as AckWait, MaxDeliver, durable name and delivery subject
  - Cluster, account, connection, leaf-node, mirror/source and topology administration
  - Stream purge, stream deletion and arbitrary message deletion
  - Stream snapshot/restore and administrative backup operations
  - Native JetStream API subjects, sequence numbers and server-internal identifiers
  potential_future_extensions:
  - Client-visible ordered replay controls and replay speed selection
  - DLQ message detail and explicit redrive operation, if the platform defines a governed redrive workflow
  - Application-level subscription seek/reset to a permitted timestamp or logical offset
  - Message tracing and end-to-end processing status query
x-client-api-design-notes:
- CORE and JETSTREAM are distinct delivery modes. CORE does not support persistence, durable replay or JetStream
  acknowledgement semantics.
- A logical destination is mapped to a NATS subject by the platform. For JetStream, the subject must be covered
  by an approved stream.
- The client supplies application identity and logical resource identifiers; the platform enforces ownership and
  authorization.
- Do not treat streamName as a create/update instruction. It is a reference to a platform-provisioned stream.
- The dead-letter endpoints are platform extensions built on configured DLQ policy; DLQ is not a standalone native
  stream API.
x-example-policy: 'All request and response examples use representative business values. Schema type declarations
  such as type: string are data types, not example placeholders.'
