      description: 'Admin API MaintenanceJob schema. Fields: maintenanceId, action, status, createdAt, startedAt,
        completedAt, result, error.'
    MaintenanceJobList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceJob'
        nextCursor: *id003
      required:
      - items
      - nextCursor
      description: 'Admin API MaintenanceJobList schema. Fields: items, nextCursor.'
    AdminStats:
      type: object
      properties:
        sampledAt: *id002
        cluster:
          type: object
          additionalProperties:
            type: number
        tenants:
          type: object
          additionalProperties:
            type: number
      required:
      - sampledAt
      - cluster
      - tenants
      description: 'Admin API AdminStats schema. Fields: sampledAt, cluster, tenants.'
    AdminResourceStatus:
      type: object
      properties:
        resourceId: *id001
        status: *id001
        message: *id001
        updatedAt: *id002
      required:
      - resourceId
      - status
      description: 'Admin API AdminResourceStatus schema. Fields: resourceId, status, message, updatedAt.'
    AdminValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items: *id001
        warnings:
          type: array
          items: *id001
      required:
      - valid
      - errors
      description: 'Admin API AdminValidationResult schema. Fields: valid, errors, warnings.'
    Problem:
      type: object
      properties:
        type: *id001
        title: *id001
        status:
          type: integer
        detail: *id001
        instance: *id001
        code: *id001
        message: *id001
        correlationId: *id001
        retryable:
          type: boolean
      description: 'Admin API Problem schema. Fields: type, title, status, detail, instance, code, message, correlationId,
        retryable.'
    OperationAccepted:
      type: object
      properties:
        operationId: *id001
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - FAILED
          - CANCELLED
        statusUrl: *id001
        createdAt: *id002
      required:
      - operationId
      - status
      description: 'Admin API OperationAccepted schema. Fields: operationId, status, statusUrl, createdAt.'
    DestinationSubjectMapping:
      type: object
      required:
      - messagingMode
      - subjects
      properties:
        messagingMode:
          type: string
          enum:
          - CORE
          - JETSTREAM
          description: Messaging mode served by this mapping.
        subjects:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: One or more NATS subject names or patterns resolved internally from the logical destination.
        streamName:
          type: string
          description: Required for JETSTREAM mappings; must identify an existing stream whose configured subjects
            cover the mapping subjects. Not allowed for CORE mappings.
      additionalProperties: false
      description: Internal mapping from a logical destination to NATS subjects and, for JetStream, a stream.
    AdminDestinationSpec:
      type: object
      required:
      - destination
      - supportedModes
      - status
      - mappings
      properties:
        destination:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          description: Stable logical destination name exposed to authorized Client API applications.
        description:
          type: string
          maxLength: 2048
        supportedModes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - CORE
            - JETSTREAM
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          default: ACTIVE
        mappings:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DestinationSubjectMapping'
          description: One or more mode-specific subject mappings. JETSTREAM mappings must reference a stream.
        metadata:
          type: object
          additionalProperties:
            type: string
      additionalProperties: false
      description: Admin-managed logical destination definition. Client APIs expose the logical name and capabilities,
        not these internal mappings.
    AdminDestinationInfo:
      type: object
      required:
      - destination
      - supportedModes
      - status
      - mappings
      - createdAt
      - updatedAt
      properties:
        destination:
          type: string
        description:
          type: string
        supportedModes:
          type: array
          items:
            type: string
            enum:
            - CORE
            - JETSTREAM
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
        mappings:
          type: array
          items:
            $ref: '#/components/schemas/DestinationSubjectMapping'
        metadata:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        etag:
          type: string
      description: Logical destination and its privileged internal subject/stream mappings.
    AdminDestinationPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminDestinationInfo'
        nextCursor:
          type: string
          nullable: true
      description: Cursor-paginated list of Admin-managed logical destinations.
    StreamSubjectsRequest:
      type: object
      required:
      - subjects
      properties:
        subjects:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
      additionalProperties: false
      description: Complete desired subject-filter set for a stream.
    AddStreamSubjectsRequest:
      type: object
      required:
      - subjects
      properties:
        subjects:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
      additionalProperties: false
      description: Subject filters to add to an existing stream. Existing filters are retained.
    StreamSubjectsResponse:
      type: object
      required:
      - streamName
      - subjects
      properties:
        streamName:
          type: string
        subjects:
          type: array
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
        etag:
          type: string
      description: Subject filters currently configured on a JetStream stream.
    JetStreamOverview:
      type: object
      required:
      - enabled
      - checkedAt
      - cluster
      - usage
      properties:
        enabled:
          type: boolean
        domain:
          type: string
        checkedAt:
          type: string
          format: date-time
        cluster:
          type: object
          properties:
            name:
              type: string
            leader:
              type: string
            replicas:
              type: integer
              minimum: 0
        usage:
          type: object
          properties:
            memoryBytes:
              type: integer
              minimum: 0
            storageBytes:
              type: integer
              minimum: 0
            streams:
              type: integer
              minimum: 0
            consumers:
              type: integer
              minimum: 0
            messages:
              type: integer
              minimum: 0
        limits:
          type: object
          additionalProperties: true
        capabilities:
          type: array
          items:
            type: string
      description: Read-only summary of JetStream availability, cluster state, resource usage and server capabilities.
