openapi: 3.0.3
info:
  title: Enterprise Messaging Platform - Admin API
  version: 1.6.0
  description: '## Introduction


    Privileged administration API for the Enterprise Messaging Platform. This contract manages NATS Core/JetStream
    platform resources and the control-plane configuration used by the Client API.


    ## Administrative responsibilities


    - **Logical destinations:** Create and maintain application-facing destination names and map them to one or
    more internal NATS subjects and, for JetStream, an approved stream.

    - **NATS subjects:** Add, inspect, replace and remove subject filters configured on JetStream streams. NATS
    subjects are routing names, not independently provisioned server resources; JetStream captures messages through
    the subject filters configured on a stream.

    - **JetStream streams:** Create, validate, update, inspect, purge and delete streams; configure retention, storage,
    replicas, limits, compression, placement, mirrors and sources.

    - **JetStream consumers:** Create, validate, update, inspect, pause, resume, batch-create and delete durable
    or ephemeral consumers. Configure delivery mode, filters, acknowledgement policy, delivery policy, redelivery,
    backoff and pending limits.

    - **Replication and recovery:** Inspect replica/source status, configure sources, run controlled replay, and
    execute backup/restore workflows.

    - **Application access:** Manage tenants, application identities, credentials and authorization policies that
    control access to logical destinations and messaging resources.

    - **Platform operations:** Inspect cluster nodes, JetStream health, diagnostics, statistics, advisories, audit
    events and long-running operations; perform controlled maintenance.

    - **Privileged boundary:** All endpoints require administrative authorization, least-privilege scopes, tenant
    isolation and audit logging. Destructive operations require explicit confirmation and are subject to platform
    policy.

    - **Client API separation:** Applications use the Client API. Native subjects, stream names, consumer names,
    cluster details and administrative controls are not exposed through the Client API.

    - **Internal storage:** Key-Value and Object Store administration, where enabled for platform operations, is
    restricted to privileged Admin scopes. These resources are not exposed through the Client API.


    ## Subject model


    - A NATS subject is a routing address, not a separately created resource in NATS Core.

    - For JetStream, a stream is configured with one or more subject filters. Messages published to matching subjects
    are captured by that stream.

    - Use the stream `subjects` property during stream creation, or the dedicated stream-subject endpoints to add,
    list, replace or remove filters later.

    - Logical destination mappings are managed separately. A JETSTREAM destination mapping must point to an existing
    stream whose configured subject filters cover its mapped subjects.

    - Do not delete a subject filter while an active logical destination depends on it. Removing a filter stops
    future capture for matching messages but does not delete already stored messages.

    '
  contact:
    name: Enterprise Messaging Platform Team
    email: messaging-platform@example.com
    url: https://messaging-api.example.com/support
servers:
- url: https://{host}
  description: Deployed environment
  variables:
    host:
      default: messaging-api.example.com
      description: Environment host name.
- url: http://localhost:8080
  description: Local development (HTTP allowed for development only).
tags:
- name: Admin - Streams
  description: Stream lifecycle, retention, stored messages and validation.
- name: Admin - Consumers
  description: Consumer lifecycle, validation, pause and resume.
- name: Admin - Key Value
  description: Key-Value bucket lifecycle.
- name: Admin - Object Store
  description: Object Store bucket lifecycle.
- name: Admin - Replication and Recovery
  description: Sources, replication status, snapshot, restore and replay.
- name: Admin - Operations
  description: All operations, detailed health and diagnostics.
- name: Admin - Tenants
  description: Tenant lifecycle and quota administration.
- name: Admin - Identities
  description: Application identities, credentials, and access policies.
- name: Admin - Platform
  description: Cluster inventory, platform configuration, and maintenance.
- name: Admin - Audit
  description: Immutable audit-event search.
- name: Admin - Observability
  description: Platform advisories and statistics.
- name: Admin - Destinations
  description: Provision logical destinations and map them to internal NATS subjects and JetStream streams.
- name: Admin - Subjects
  description: Manage the subject filters configured on JetStream streams; subjects are not standalone NATS resources.
- name: Admin - JetStream
  description: Inspect JetStream runtime status, cluster capability and resource usage.
security:
- oauth2: []
paths:
  /api/v1/admin/streams:
    get:
      tags:
      - Admin - Streams
      operationId: listStreams
      summary: List streams
      description: Cursor-paginated list of streams.
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/SubjectFilter'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      security:
      - oauth2:
        - admin:streams:read
      responses:
        '200':
          description: Page of streams.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamPage'
              example:
                items:
                - name: PAYMENTS
                  createdAt: '2026-10-29T06:30:00Z'
                  config:
                    name: PAYMENTS
                    description: Payment domain events
                    subjects:
                    - payments.>
                    retention: LIMITS
                    storage: FILE
                    replicas: 3
                    maxAgeMs: 259200000
                    maxBytes: -1
                    maxMessages: -1
                    maxMessageBytes: -1
                    maxMessagesPerSubject: -1
                    discardPolicy: OLD
                    duplicateWindowMs: 120000
                  state:
                    messages: 105
                    bytes: 12500000
                    firstSequence: 1
                    lastSequence: 105
                    consumerCount: 2
                    subjectCount: 4
                    deletedCount: 0
                  cluster:
                    name: mumbai-primary
                    leader: nats-2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-sdk-group: admin
      x-idempotent: true
    post:
      tags:
      - Admin - Streams
      operationId: createStream
      summary: Create a stream
      description: Creates a JetStream stream. Platform policy may restrict replicas, storage, subjects, retention
        and limits. Creating a stream with the same name and identical configuration is idempotent (`200`-equivalent
        replay via `Idempotency-Key`); a different configuration returns `409`.
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamSpec'
            example:
              name: PAYMENTS
              description: Payment domain events
              subjects:
              - payments.>
              retention: LIMITS
              storage: FILE
              replicas: 3
              maxAgeMs: 259200000
              maxBytes: -1
              maxMessages: -1
              maxMessageBytes: -1
              maxMessagesPerSubject: -1
              discardPolicy: OLD
              duplicateWindowMs: 120000
        description: Request payload for create a stream.
      security:
      - oauth2:
        - admin:streams:write
      responses:
        '201':
          description: Stream created.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamInfo'
              example:
                name: PAYMENTS
                createdAt: '2026-10-29T06:30:00Z'
                config:
                  name: PAYMENTS
                  description: Payment domain events
                  subjects:
                  - payments.>
                  retention: LIMITS
                  storage: FILE
                  replicas: 3
                  maxAgeMs: 259200000
                  maxBytes: -1
                  maxMessages: -1
                  maxMessageBytes: -1
                  maxMessagesPerSubject: -1
                  discardPolicy: OLD
                  duplicateWindowMs: 120000
                state:
                  messages: 105
                  bytes: 12500000
                  firstSequence: 1
                  lastSequence: 105
                  consumerCount: 2
                  subjectCount: 4
                  deletedCount: 0
                cluster:
                  name: mumbai-primary
                  leader: nats-2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-sdk-group: admin
      x-idempotent: true
  /api/v1/admin/streams/{streamName}:
    get:
      tags:
      - Admin - Streams
      operationId: getStream
      summary: Get stream configuration and state
      description: Returns config, state and cluster info.
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/StreamName'
      security:
      - oauth2:
        - admin:streams:read
      responses:
        '200':
          description: Stream.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamInfo'
              example:
                name: PAYMENTS
                createdAt: '2026-10-29T06:30:00Z'
                config:
                  name: PAYMENTS
                  description: Payment domain events
                  subjects:
                  - payments.>
                  retention: LIMITS
                  storage: FILE
                  replicas: 3
                  maxAgeMs: 259200000
                  maxBytes: -1
                  maxMessages: -1
                  maxMessageBytes: -1
                  maxMessagesPerSubject: -1
                  discardPolicy: OLD
                  duplicateWindowMs: 120000
                state:
                  messages: 105
                  bytes: 12500000
                  firstSequence: 1
                  lastSequence: 105
                  consumerCount: 2
                  subjectCount: 4
                  deletedCount: 0
                cluster:
                  name: mumbai-primary
                  leader: nats-2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-sdk-group: admin
      x-idempotent: true
    put:
      tags:
      - Admin - Streams
      operationId: updateStream
      summary: Update a stream configuration
      description: Full desired configuration. Immutable fields (e.g. `storage`, `name`) return `400`. The server
        validates against the deployed NATS version. Send `If-Match` with the stream ETag to avoid lost updates.
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/StreamName'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamSpec'
            example:
              name: PAYMENTS
              description: Payment domain events
              subjects:
              - payments.>
              retention: LIMITS
              storage: FILE
              replicas: 3
              maxAgeMs: 604800000
              maxBytes: -1
              maxMessages: -1
              maxMessageBytes: -1
              maxMessagesPerSubject: -1
              discardPolicy: OLD
              duplicateWindowMs: 120000
        description: Request payload for update a stream configuration.
      security:
      - oauth2:
        - admin:streams:write
      responses:
        '200':
          description: Updated stream.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamInfo'
              example:
                name: PAYMENTS
                createdAt: '2026-10-29T06:30:00Z'
                config:
                  name: PAYMENTS
                  description: Payment domain events
                  subjects:
                  - payments.>
                  retention: LIMITS
                  storage: FILE
                  replicas: 3
                  maxAgeMs: 604800000
                  maxBytes: -1
                  maxMessages: -1
                  maxMessageBytes: -1
                  maxMessagesPerSubject: -1
                  discardPolicy: OLD
                  duplicateWindowMs: 120000
                state:
                  messages: 105
                  bytes: 12500000
                  firstSequence: 1
                  lastSequence: 105
                  consumerCount: 2
                  subjectCount: 4
                  deletedCount: 0
                cluster:
                  name: mumbai-primary
                  leader: nats-2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-sdk-group: admin
      x-idempotent: true
    delete:
      tags:
      - Admin - Streams
      operationId: deleteStream
      summary: Delete a stream
      description: DESTRUCTIVE. Requires `admin:streams:delete`, `confirm=true`, and is audit-logged. Honors `denyDelete`.
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/StreamName'
      - $ref: '#/components/parameters/Confirm'
      security:
      - oauth2:
        - admin:streams:delete
      responses:
        '204':
          description: Stream deleted.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-sdk-group: admin
      x-idempotent: true
  /api/v1/admin/streams/{streamName}/purge:
    post:
      tags:
      - Admin - Streams
      operationId: purgeStream
      summary: Purge messages from a stream
      description: 'DESTRUCTIVE. `confirm` must be `true`. With no filters ALL messages are purged. Filters: `subject`,
        `upToSequence` (purge below this sequence), `keep` (retain newest N). `upToSequence` and `keep` are mutually
        exclusive. Honors `denyPurge`.'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/StreamName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurgeRequest'
            example:
              confirm: true
              keep: 100
              subject: payments.test.>
        description: Request payload for purge messages from a stream.
      security:
      - oauth2:
        - admin:streams:delete
      responses:
        '200':
          description: Purge completed.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurgeResponse'
              example:
                streamName: PAYMENTS
                purgedMessages: 900
                messagesRemaining: 100
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-sdk-group: admin
      x-idempotent: false
  /api/v1/admin/streams/{streamName}/messages/{sequence}:
    get:
      tags:
      - Admin - Streams
      operationId: getStoredMessage
      summary: Read a stored message by stream sequence
      description: Direct read of one stored message.
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/StreamName'
      - $ref: '#/components/parameters/Sequence'
      security:
      - oauth2:
        - admin:streams:read
      responses:
        '200':
          description: Stored message.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredMessage'
              example:
                streamName: PAYMENTS
                sequence: 105
                subject: payments.created
                payload: eyJwYXltZW50SWQiOiJQYXktMTAwMSJ9
                contentType: application/json
                headers:
                  Source: checkout-service
                timestamp: '2026-10-29T06:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-sdk-group: admin
      x-idempotent: true
    delete:
      tags:
      - Admin - Streams
      operationId: deleteStoredMessage
      summary: Delete a stored message by sequence
      description: DESTRUCTIVE. `secure=true` also overwrites the data on disk (secure erase). Requires `confirm=true`.
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/StreamName'
      - $ref: '#/components/parameters/Sequence'
      - $ref: '#/components/parameters/Confirm'
      - $ref: '#/components/parameters/SecureErase'
      security:
      - oauth2:
        - admin:streams:delete
      responses:
        '204':
          description: Message deleted.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-sdk-group: admin
      x-idempotent: true
  /api/v1/admin/streams/{streamName}/last-message:
    get:
      tags:
      - Admin - Streams
      operationId: getLastMessageBySubject
      summary: Read the last stored message for a subject
      description: Returns the most recent message whose subject matches `subject` (wildcards allowed).
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/StreamName'
      - $ref: '#/components/parameters/RequiredSubject'
      security:
      - oauth2:
        - admin:streams:read
      responses:
        '200':
          description: Stored message.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredMessage'
              example:
                streamName: PAYMENTS
                sequence: 105
                subject: payments.created
                payload: eyJwYXltZW50SWQiOiJQYXktMTAwMSJ9
                timestamp: '2026-10-29T06:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-sdk-group: admin
      x-idempotent: true
  /api/v1/admin/streams:validate-config:
    post:
      tags:
      - Admin - Streams
      operationId: validateStreamConfig
      summary: Validate a stream configuration without applying it
      description: Validates enterprise policy and compatibility with the deployed NATS version for a new or existing
        stream. Never mutates anything.
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamSpec'
            example:
              name: PAYMENTS
              description: Payment domain events
              subjects:
              - payments.>
              retention: LIMITS
              storage: FILE
              replicas: 3
              maxAgeMs: 259200000
              maxBytes: -1
              maxMessages: -1
              maxMessageBytes: -1
              maxMessagesPerSubject: -1
              discardPolicy: OLD
              duplicateWindowMs: 120000
        description: Request payload for validate a stream configuration without applying it.
      security:
      - oauth2:
        - admin:streams:read
      responses:
        '200':
          description: Validation completed.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
              example:
                valid: true
                errors: []
                warnings:
                - field: maxAgeMs
                  code: QUOTA_CHECK
                  message: Confirm storage quota covers the retention target.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-sdk-group: admin
      x-idempotent: true
  /api/v1/admin/streams:batch-create:
    post:
      tags:
      - Admin - Streams
      operationId: batchCreateStreams
      summary: Create multiple streams
      description: Creates each stream independently; NOT atomic. Duplicate names are reported as per-item failures.
        `dryRun=true` validates only.
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchStreamCreateRequest'
            example:
              dryRun: false
              streams:
              - name: PAYMENTS
                description: Payment domain events
                subjects:
                - payments.>
                retention: LIMITS
                storage: FILE
                replicas: 3
                maxAgeMs: 259200000
                maxBytes: -1
                maxMessages: -1
                maxMessageBytes: -1
                maxMessagesPerSubject: -1
                discardPolicy: OLD
                duplicateWindowMs: 120000
              - name: DELIVERY
                description: Delivery events
                subjects:
                - delivery.>
                retention: LIMITS
                storage: FILE
                replicas: 3
                maxAgeMs: 259200000
                maxBytes: -1
                maxMessages: -1
                maxMessageBytes: -1
                maxMessagesPerSubject: -1
                discardPolicy: OLD
                duplicateWindowMs: 120000
        description: Request payload for create multiple streams.
      security:
      - oauth2:
        - admin:streams:write
      responses:
        '200':
          description: All items evaluated.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAdminResponse'
              example:
                total: 2
                succeeded: 1
                failed: 1
                dryRun: false
                results:
                - index: 0
                  resourceName: PAYMENTS
                  status: SUCCEEDED
                - index: 1
                  resourceName: DELIVERY
                  status: FAILED
                  error:
                    code: RESOURCE_ALREADY_EXISTS
                    message: Stream already exists
                    correlationId: corr-992a
                    retryable: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-sdk-group: admin
      x-idempotent: true
  /api/v1/admin/streams/{streamName}/snapshot:
    post:
      tags:
      - Admin - Replication and Recovery
      operationId: createStreamSnapshot
      summary: Start a stream snapshot export
      description: Asynchronous. Exports to an approved `destinationProfile`; credentials are never passed in requests.
