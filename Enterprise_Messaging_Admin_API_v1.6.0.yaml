components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth2 client credentials.
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.com/oauth2/token
          scopes:
            admin:streams:read: Read stream configuration and stored messages
            admin:streams:write: Create and update streams
            admin:streams:delete: Delete streams, purge, delete stored messages
            admin:consumers:read: Read consumers
            admin:consumers:write: Create, update, delete, pause consumers
            admin:kv: Administer Key-Value buckets
            admin:objects: Administer Object Stores
            admin:replication: Sources, mirrors, replay and replication status
            admin:backup: Snapshot and restore
            admin:operations: List and manage all operations
            admin:diagnostics: Health and diagnostics
            admin:identities:read: Privileged administration permission.
            admin:platform:write: Change platform configuration and perform controlled node maintenance.
            admin:observability:read: Privileged administration permission.
            admin:tenants:write: Privileged administration permission.
            admin:operations:write: Privileged administration permission.
            admin:tenants:read: Privileged administration permission.
            admin:operations:read: Privileged administration permission.
            admin:identities:write: Privileged administration permission.
            admin:policies:write: Privileged administration permission.
            admin:platform:read: Privileged administration permission.
            admin:policies:read: Privileged administration permission.
            admin:audit:read: Privileged administration permission.
            admin:jetstream:read: Read JetStream runtime overview and configuration status.
            admin:destinations:read: Read logical destination definitions and subject mappings.
            admin:destinations:write: Create and update logical destination definitions and subject mappings.
            admin:destinations:delete: Delete logical destination definitions.
            admin:subjects:read: Read subject filters configured on JetStream streams.
            admin:subjects:write: Add, replace or remove subject filters configured on JetStream streams.
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Caller-supplied correlation ID. Generated by the server if absent and always echoed in the response
        and in errors.
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
      description: W3C Trace Context header; propagated into NATS message headers.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: HTTP-level idempotency key (stable per logical request). Replays within the platform window return
        the original response. Distinct from JetStream `messageId`.
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema:
        type: string
      description: Resume SSE after this event id (stream sequence).
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: Quoted ETag/revision the resource must currently have; `412` on mismatch.
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
      description: '`*` = only if absent (`409`/`412` otherwise); or an ETag for conditional GET (`304`).'
    Range:
      name: Range
      in: header
      required: false
      schema:
        type: string
        pattern: ^bytes=\d*-\d*$
      description: Single byte range, e.g. `bytes=0-1023`.
    ObjectDescription:
      name: X-Object-Description
      in: header
      required: false
      schema:
        type: string
        maxLength: 1024
      description: Optional description stored in object metadata.
    StreamName:
      name: streamName
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,128}$
      description: Stream name.
    ConsumerName:
      name: consumerName
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,128}$
      description: Consumer name (unique per stream).
    BucketName:
      name: bucketName
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,128}$
      description: Key-Value bucket name.
    StoreName:
      name: storeName
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,128}$
      description: Object Store bucket name.
    ObjectName:
      name: objectName
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 1024
      description: Object name; MUST be percent-encoded.
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        maxLength: 128
      description: Long-running operation id.
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        maxLength: 128
      description: Managed subscription id.
    SourceName:
      name: sourceName
      in: path
      required: true
      schema:
        type: string
      description: Source stream name.
    Sequence:
      name: sequence
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: Stream sequence number.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
        default: 100
      description: Page size.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque cursor from `nextCursor` of the previous page.
    Confirm:
      name: confirm
      in: query
      required: true
      schema:
        type: boolean
        enum:
        - true
      description: Must be `true` to confirm a destructive operation.
    SecureErase:
      name: secure
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: Overwrite data on disk when deleting.
    Purge:
      name: purge
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: Remove all history for the key.
    KvKey:
      name: key
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 1024
      description: Key name (query parameter because keys may contain `/`).
    KeyPrefix:
      name: prefix
      in: query
      required: false
      schema:
        type: string
      description: Key prefix filter.
    ObjectPrefix:
      name: prefix
      in: query
      required: false
      schema:
        type: string
      description: Object name prefix filter.
    Revision:
      name: revision
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
      description: Specific revision to read.
    SubjectFilter:
      name: subject
      in: query
      required: false
      schema:
        type: string
      description: Only streams capturing this subject.
    RequiredSubject:
      name: subject
      in: query
      required: true
      schema:
        type: string
        minLength: 1
      description: Subject (wildcards allowed).
    OperationStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
        - PENDING
        - RUNNING
        - SUCCEEDED
        - FAILED
        - CANCELLED
      description: Filter by status.
  headers:
    CorrelationId:
      description: Correlation id of this request.
      schema:
        type: string
    Location:
      description: URL of the created or accepted resource.
      schema:
        type: string
    ETag:
      description: Quoted entity tag/revision for use with `If-Match`.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        format: int32
        minimum: 0
  responses:
    BadRequest:
      description: Invalid input or unsupported configuration.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            type: about:blank
            title: Invalid input or unsupported configuration.
            status: 400
            code: VALIDATION_ERROR
            message: replicas must be between 1 and 5.
            correlationId: corr-abc123
            retryable: false
    Unauthorized:
      description: Authentication missing or invalid.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            type: about:blank
            title: Authentication missing or invalid.
            status: 401
            code: UNAUTHENTICATED
            message: A valid bearer token is required.
            correlationId: corr-abc123
            retryable: false
    Forbidden:
      description: Authenticated but lacks the required scope or permission.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            type: about:blank
            title: Authenticated but lacks the required scope or permission.
            status: 403
            code: PERMISSION_DENIED
            message: Caller cannot delete stream PAYMENTS.
            correlationId: corr-abc123
            retryable: false
    NotFound:
      description: Resource does not exist.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            type: about:blank
            title: Resource does not exist.
            status: 404
            code: RESOURCE_NOT_FOUND
            message: Consumer payments-pull was not found on stream PAYMENTS.
            correlationId: corr-abc123
            retryable: false
    Conflict:
      description: Resource exists or state conflicts.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            type: about:blank
            title: Resource exists or state conflicts.
            status: 409
            code: RESOURCE_CONFLICT
            message: Stream PAYMENTS already exists with a different configuration.
            correlationId: corr-abc123
            retryable: false
    Gone:
      description: Delivery token or resource expired.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            type: about:blank
            title: Delivery token or resource expired.
            status: 410
            code: DELIVERY_TOKEN_EXPIRED
            message: Delivery token is no longer valid.
            correlationId: corr-abc123
            retryable: false
    PreconditionFailed:
      description: If-Match / expected-state precondition failed.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            type: about:blank
            title: If-Match / expected-state precondition failed.
            status: 412
            code: PRECONDITION_FAILED
            message: 'Revision mismatch: expected 17, current 18.'
            correlationId: corr-abc123
            retryable: false
    PreconditionRequired:
      description: A conditional header is required.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            type: about:blank
            title: A conditional header is required.
            status: 428
            code: PRECONDITION_REQUIRED
            message: If-Match is required.
            correlationId: corr-abc123
            retryable: false
    PayloadTooLarge:
      description: Request exceeds the configured batch or payload limit.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            type: about:blank
            title: Request exceeds the configured batch or payload limit.
            status: 413
            code: PAYLOAD_TOO_LARGE
            message: Batch exceeds the maximum of 500 messages.
            correlationId: corr-abc123
            retryable: false
    RangeNotSatisfiable:
      description: Requested range is outside the object.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            type: about:blank
            title: Requested range is outside the object.
            status: 416
            code: RANGE_NOT_SATISFIABLE
            message: Range exceeds object size 28412.
            correlationId: corr-abc123
            retryable: false
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            type: about:blank
            title: Rate limit exceeded.
            status: 429
            code: RATE_LIMITED
            message: Request rate limit exceeded.
            correlationId: corr-abc123
            retryable: true
    InternalError:
      description: Unexpected platform error.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            type: about:blank
            title: Unexpected platform error.
            status: 500
            code: INTERNAL_ERROR
            message: An unexpected error occurred.
            correlationId: corr-abc123
            retryable: true
    NotImplemented:
      description: Capability is not configured on this deployment.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            type: about:blank
            title: Capability is not configured on this deployment.
            status: 501
            code: NOT_IMPLEMENTED
            message: Snapshot export integration is not configured.
            correlationId: corr-abc123
            retryable: false
    UpstreamError:
      description: NATS or JetStream returned an upstream error.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            type: about:blank
            title: NATS or JetStream returned an upstream error.
            status: 502
            code: NATS_UPSTREAM_ERROR
            message: JetStream publish failed.
            correlationId: corr-abc123
            retryable: true
    ServiceUnavailable:
      description: Service or dependency temporarily unavailable (includes NATS no-responders).
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            type: about:blank
            title: Service or dependency temporarily unavailable (includes NATS no-responders).
            status: 503
            code: SERVICE_UNAVAILABLE
            message: Messaging backend unavailable.
            correlationId: corr-abc123
            retryable: true
    GatewayTimeout:
      description: Upstream did not respond before the deadline.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            type: about:blank
            title: Upstream did not respond before the deadline.
            status: 504
            code: UPSTREAM_TIMEOUT
            message: Timed out waiting for JetStream publish acknowledgement.
            correlationId: corr-abc123
            retryable: true
    UnprocessableEntity:
      description: Request content is syntactically valid but violates platform or resource validation rules.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ApiError:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: RFC 9457 problem type.
        title:
          type: string
        status:
          type: integer
          format: int32
          description: HTTP status.
        code:
          type: string
          description: Stable machine-readable code (see catalog in API description).
        message:
          type: string
          description: Human-readable explanation.
        detail:
          type: string
        instance:
          type: string
        correlationId:
          type: string
        retryable:
          type: boolean
          description: True if retrying the same request may succeed.
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              issue:
                type: string
      required:
      - code
      - message
      - correlationId
      - retryable
      description: RFC 9457 problem details extended with platform members. Media type `application/problem+json`.
    BatchItemStatus:
      type: string
      enum:
      - SUCCEEDED
      - FAILED
      description: Unified item outcome vocabulary used by all batch APIs.
    BatchPublishItemResult:
      type: object
      properties:
        index:
          type: integer
          format: int32
          minimum: 0
          description: Zero-based index in the submitted array.
        status:
          $ref: '#/components/schemas/BatchItemStatus'
        subject:
          type: string
        persisted:
          type: boolean
        streamName:
          type: string
        sequence:
          type: integer
          format: int64
        duplicate:
          type: boolean
        error:
          $ref: '#/components/schemas/ApiError'
      required:
      - index
      - status
      - subject
      description: 'Admin API BatchPublishItemResult schema. Fields: index, status, subject, persisted, streamName,
        sequence, duplicate, error.'
    BatchPublishResponse:
      type: object
      properties:
        total:
          type: integer
          format: int32
          minimum: 0
        succeeded:
          type: integer
          format: int32
          minimum: 0
        failed:
          type: integer
          format: int32
          minimum: 0
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchPublishItemResult'
      required:
      - total
      - succeeded
      - failed
      - results
      description: 'Admin API BatchPublishResponse schema. Fields: total, succeeded, failed, results.'
    MessageEnvelope:
      type: object
      properties:
        subject:
          type: string
        payload:
          type: string
          format: byte
        contentType:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
          description: Message headers. Names beginning with `Nats-` are reserved and rejected.
        timestamp:
          type: string
          format: date-time
      required:
      - subject
      - payload
      description: 'Admin API MessageEnvelope schema. Fields: subject, payload, contentType, headers, timestamp.'
    StoredMessage:
      allOf:
      - $ref: '#/components/schemas/MessageEnvelope'
      - type: object
        properties:
          streamName:
            type: string
          sequence:
            type: integer
            format: int64
            minimum: 1
        required:
        - streamName
        - sequence
      description: Admin API StoredMessage schema. Represents the stored message resource.
    StreamSource:
      type: object
      properties:
        name:
          type: string
          description: Source stream name.
        connectionProfile:
          type: string
          description: Approved connection profile id for a remote cluster; omit for local. Credentials are configured
            out of band.
        filterSubject:
          type: string
        startSequence:
          type: integer
          format: int64
          minimum: 1
        startTime:
          type: string
          format: date-time
        subjectTransforms:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
              destination:
                type: string
            required:
            - source
            - destination
      required:
      - name
      description: 'Admin API StreamSource schema. Fields: name, connectionProfile, filterSubject, startSequence,
        startTime, subjectTransforms.'
    StreamSpec:
      type: object
      properties:
        name:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
        description:
          type: string
          maxLength: 4096
        subjects:
          type: array
          items:
            type: string
          description: Required unless `mirror` is set.
        retention:
          type: string
          enum:
          - LIMITS
          - INTEREST
          - WORK_QUEUE
          default: LIMITS
        storage:
          type: string
          enum:
          - FILE
          - MEMORY
          default: FILE
        replicas:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          default: 1
          description: Platform policy may restrict to 1, 3 or 5.
        maxAgeMs:
          type: integer
          format: int64
          minimum: -1
          default: -1
          description: -1 = unlimited.
        maxMessages:
          type: integer
          format: int64
          minimum: -1
          default: -1
          description: -1 = unlimited.
        maxBytes:
          type: integer
          format: int64
          minimum: -1
          default: -1
          description: -1 = unlimited.
        maxMessageBytes:
          type: integer
          format: int32
          minimum: -1
          default: -1
          description: -1 = unlimited.
        maxMessagesPerSubject:
          type: integer
          format: int64
          minimum: -1
          default: -1
          description: -1 = unlimited.
        maxConsumers:
          type: integer
          format: int32
          minimum: -1
          default: -1
        discardPolicy:
          type: string
          enum:
          - OLD
          - NEW
          default: OLD
        discardNewPerSubject:
          type: boolean
        duplicateWindowMs:
          type: integer
          format: int64
          minimum: 0
          default: 120000
        denyDelete:
          type: boolean
          default: false
        denyPurge:
          type: boolean
          default: false
        allowRollup:
          type: boolean
          default: false
        allowDirect:
          type: boolean
          default: false
        mirrorDirect:
          type: boolean
          default: false
        allowMessageTtl:
          type: boolean
          description: Requires a server version supporting per-message TTL.
        allowAtomicPublish:
          type: boolean
          description: Requires a server version supporting atomic batch publish.
        sealed:
          type: boolean
          default: false
        compression:
          type: string
          enum:
          - NONE
          - S2
          default: NONE
        placement:
          type: object
          properties:
            cluster:
              type: string
            tags:
              type: array
              items:
                type: string
        mirror:
          $ref: '#/components/schemas/StreamSource'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/StreamSource'
        subjectTransform:
          type: object
          properties:
            source:
              type: string
            destination:
              type: string
          required:
          - source
          - destination
        republish:
          type: object
          properties:
            source:
              type: string
            destination:
              type: string
            headersOnly:
              type: boolean
          required:
          - destination
        consumerLimits:
          type: object
          properties:
            inactiveThresholdMs:
              type: integer
              format: int64
              minimum: 0
            maxAckPending:
              type: integer
              format: int32
              minimum: 0
        metadata:
          type: object
          additionalProperties:
            type: string
      required:
      - name
      description: Desired stream configuration. Fields are validated against the deployed NATS version.
    StreamState:
      type: object
      properties:
        messages:
          type: integer
          format: int64
        bytes:
          type: integer
          format: int64
        firstSequence:
          type: integer
          format: int64
        lastSequence:
          type: integer
          format: int64
        firstTimestamp:
          type: string
          format: date-time
        lastTimestamp:
          type: string
          format: date-time
        consumerCount:
          type: integer
          format: int32
        subjectCount:
          type: integer
          format: int64
        deletedCount:
          type: integer
          format: int64
      description: 'Admin API StreamState schema. Fields: messages, bytes, firstSequence, lastSequence, firstTimestamp,
        lastTimestamp, consumerCount, subjectCount, deletedCount.'
    StreamInfo:
      type: object
      properties:
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        config:
          $ref: '#/components/schemas/StreamSpec'
        state:
          $ref: '#/components/schemas/StreamState'
        cluster:
          type: object
          properties:
            name:
              type: string
            leader:
              type: string
      required:
      - name
      - config
      - state
      description: 'Admin API StreamInfo schema. Fields: name, createdAt, config, state, cluster.'
    StreamPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StreamInfo'
        nextCursor:
          type: string
          nullable: true
      required:
      - items
      description: 'Admin API StreamPage schema. Fields: items, nextCursor.'
    PurgeRequest:
      type: object
      properties:
        confirm:
          type: boolean
          enum:
          - true
          description: Must be true. With no other field ALL messages are purged.
        subject:
          type: string
        upToSequence:
          type: integer
          format: int64
          minimum: 1
        keep:
          type: integer
          format: int64
          minimum: 0
      required:
      - confirm
      description: 'Admin API PurgeRequest schema. Fields: confirm, subject, upToSequence, keep.'
    PurgeResponse:
      type: object
      properties:
        streamName:
          type: string
        purgedMessages:
          type: integer
          format: int64
        messagesRemaining:
          type: integer
          format: int64
      required:
      - streamName
      - purgedMessages
      description: 'Admin API PurgeResponse schema. Fields: streamName, purgedMessages, messagesRemaining.'
    BatchStreamCreateRequest:
      type: object
      properties:
        dryRun:
          type: boolean
          default: false
        streams:
          type: array
          items:
            $ref: '#/components/schemas/StreamSpec'
          minItems: 1
          maxItems: 100
      required:
      - streams
      description: 'Admin API BatchStreamCreateRequest schema. Fields: dryRun, streams.'
    BatchConsumerCreateRequest:
      type: object
      properties:
        dryRun:
          type: boolean
          default: false
        consumers:
          type: array
          items:
            $ref: '#/components/schemas/ConsumerSpec'
          minItems: 1
          maxItems: 100
      required:
      - consumers
      description: 'Admin API BatchConsumerCreateRequest schema. Fields: dryRun, consumers.'
    BatchAdminResponse:
      type: object
      properties:
        total:
          type: integer
          format: int32
        succeeded:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32
        dryRun:
          type: boolean
        results:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                format: int32
                minimum: 0
              resourceName:
                type: string
              status:
                $ref: '#/components/schemas/BatchItemStatus'
              error:
                $ref: '#/components/schemas/ApiError'
            required:
            - index
            - resourceName
            - status
      required:
      - total
      - succeeded
      - failed
      - results
      description: 'Admin API BatchAdminResponse schema. Fields: total, succeeded, failed, dryRun, results.'
    ValidationIssue:
      type: object
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
      required:
      - message
      description: 'Admin API ValidationIssue schema. Fields: field, code, message.'
    ValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
      required:
      - valid
      - errors
      - warnings
      description: 'Admin API ValidationResult schema. Fields: valid, errors, warnings.'
    SnapshotRequest:
      type: object
      properties:
        destinationProfile:
          type: string
          description: Approved backup destination id. Never pass cloud credentials.
        retentionClass:
          type: string
          enum:
          - STANDARD
          - LONG_TERM
          default: STANDARD
      required:
      - destinationProfile
      description: 'Admin API SnapshotRequest schema. Fields: destinationProfile, retentionClass.'
    RestoreRequest:
      type: object
      properties:
        destinationProfile:
          type: string
        backupId:
          type: string
        targetStreamName:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
        overwrite:
          type: boolean
          default: false
          description: Required to restore over an existing stream; also needs `confirm`.
        confirm:
          type: boolean
          description: Must be true when `overwrite` is true.
      required:
      - destinationProfile
      - backupId
      description: 'Admin API RestoreRequest schema. Fields: destinationProfile, backupId, targetStreamName, overwrite,
        confirm.'
    ReplayRequest:
      type: object
      properties:
        startPosition:
          type: string
          enum:
          - ALL
          - SEQUENCE
          - TIME
          - LAST
        sequence:
          type: integer
          format: int64
          minimum: 1
        timestamp:
          type: string
          format: date-time
        subjectFilter:
          type: string
        targetSubjectPrefix:
          type: string
          minLength: 1
        rateLimitMessagesPerSecond:
          type: integer
          format: int32
          minimum: 1
        maxMessages:
          type: integer
          format: int64
          minimum: 1
      required:
      - startPosition
      - targetSubjectPrefix
      description: 'Admin API ReplayRequest schema. Fields: startPosition, sequence, timestamp, subjectFilter, targetSubjectPrefix,
        rateLimitMessagesPerSecond, maxMessages.'
    ReplicationStatus:
      type: object
      properties:
        streamName:
          type: string
        status:
          type: string
          enum:
          - HEALTHY
          - DEGRADED
          - UNAVAILABLE
        leader:
          type: string
        replicas:
          type: array
          items:
            type: object
            properties:
              node:
                type: string
              current:
                type: boolean
              active:
                type: boolean
              lag:
                type: integer
                format: int64
        sources:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              cluster:
                type: string
              active:
                type: boolean
              lag:
                type: integer
                format: int64
              lastActiveAt:
                type: string
                format: date-time
              error:
                type: string
      required:
      - streamName
      - status
      description: 'Admin API ReplicationStatus schema. Fields: streamName, status, leader, replicas, sources.'
    ConsumerSpec:
      type: object
      properties:
        name:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
          description: Durable name. Omit for an ephemeral consumer (server-assigned name).
        description:
          type: string
          maxLength: 4096
        deliveryMode:
          type: string
          enum:
          - PULL
          - PUSH
          default: PULL
        deliverSubject:
          type: string
          description: Required when PUSH; forbidden when PULL.
        deliverGroup:
          type: string
          description: Queue group (PUSH).
        filterSubjects:
          type: array
          items:
            type: string
        ackPolicy:
          type: string
          enum:
          - EXPLICIT
          - ALL
          - NONE
          default: EXPLICIT
        deliverPolicy:
          type: string
          enum:
          - ALL
          - NEW
          - LAST
          - LAST_PER_SUBJECT
          - BY_START_SEQUENCE
          - BY_START_TIME
          default: ALL
        startSequence:
          type: integer
          format: int64
          minimum: 1
          description: Required for BY_START_SEQUENCE.
        startTime:
          type: string
          format: date-time
          description: Required for BY_START_TIME.
        ackWaitMs:
          type: integer
          format: int64
          minimum: 1
          default: 30000
        maxDeliver:
          type: integer
          format: int32
          minimum: -1
          default: -1
        backoffMs:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
          description: Redelivery backoff; length must not exceed `maxDeliver` when set.
        maxAckPending:
          type: integer
          format: int32
          minimum: -1
          default: 1000
        maxWaiting:
          type: integer
          format: int32
          minimum: 1
        maxRequestBatch:
          type: integer
          format: int32
          minimum: 1
        maxRequestExpiresMs:
          type: integer
          format: int64
          minimum: 1
        maxRequestMaxBytes:
          type: integer
          format: int64
          minimum: 1
        replayPolicy:
          type: string
          enum:
          - INSTANT
          - ORIGINAL
          default: INSTANT
        rateLimitBitsPerSecond:
          type: integer
          format: int64
          minimum: 1
        sampleFrequency:
          type: string
          example: 100%
        headersOnly:
          type: boolean
          default: false
        flowControl:
          type: boolean
          default: false
        idleHeartbeatMs:
          type: integer
          format: int64
          minimum: 0
        inactiveThresholdMs:
          type: integer
          format: int64
          minimum: 0
        replicas:
          type: integer
          format: int32
          minimum: 0
          maximum: 5
          description: 0 = inherit from stream.
        memoryStorage:
          type: boolean
          default: false
        priorityPolicy:
          type: string
          enum:
          - NONE
          - OVERFLOW
          - PINNED_CLIENT
          - PRIORITIZED
          description: Requires a server version with priority groups.
        priorityGroups:
          type: array
          items:
            type: string
